<style>
/* Provider auth settings mockup (Phase 3, 261122-feat-ws-provider-auth-layer).
   Every rule is scoped under .pa-mk; tokens follow the host root's data-theme
   unless the wrapper carries its own. Widths use a container query so the
   fragment collapses by its own width inside a whiteboard panel. */
.pa-mk {
  --wb-bg: #f3f3f0; --wb-fg: #1b1d21; --wb-card: #ffffff; --wb-muted: #e9e8e3; --wb-muted-fg: #5f646b;
  --wb-primary: #2b62d9; --wb-primary-fg: #ffffff;
  --wb-line: color-mix(in srgb, var(--wb-fg) 14%, transparent);
  --wb-wash: color-mix(in srgb, var(--wb-fg) 5%, transparent);
  --wb-ok: #1d7348; --wb-fail: #a72e36; --wb-warn: #986300; --wb-warn-ink: #7a4c00;
  --wb-shadow: 0 1px 2px rgb(0 0 0 / .10), 0 2px 6px rgb(0 0 0 / .05);
  --wb-radius: 12px;
  --wb-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --wb-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: light;
  container: pa / inline-size;
  box-sizing: border-box; padding: 10px 0 24px;
  background: var(--wb-bg); color: var(--wb-fg); font: 13px/1.45 var(--wb-sans); -webkit-font-smoothing: antialiased;
}
:root[data-theme="dark"] .pa-mk:not([data-theme="light"]), .pa-mk[data-theme="dark"] {
  --wb-bg: #141518; --wb-fg: #e7e7e4; --wb-card: #1e2024; --wb-muted: #2b2d32; --wb-muted-fg: #a2a6ad;
  --wb-primary: #7aa2ff; --wb-primary-fg: #0c1424;
  --wb-ok: #6cc39a; --wb-fail: #f1888e; --wb-warn: #e0a741; --wb-warn-ink: #f6c76b;
  --wb-shadow: 0 1px 2px rgb(0 0 0 / .45), 0 2px 8px rgb(0 0 0 / .25);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) .pa-mk:not([data-theme="light"]) {
    --wb-bg: #141518; --wb-fg: #e7e7e4; --wb-card: #1e2024; --wb-muted: #2b2d32; --wb-muted-fg: #a2a6ad;
    --wb-primary: #7aa2ff; --wb-primary-fg: #0c1424;
    --wb-ok: #6cc39a; --wb-fail: #f1888e; --wb-warn: #e0a741; --wb-warn-ink: #f6c76b;
    --wb-shadow: 0 1px 2px rgb(0 0 0 / .45), 0 2px 8px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
.pa-mk * { box-sizing: border-box; }
.pa-mk button, .pa-mk input, .pa-mk select, .pa-mk textarea { font: inherit; color: inherit; }
.pa-mk code, .pa-mk .mono { font-family: var(--wb-mono); }
.pa-mk .i { width: 14px; height: 14px; flex: none; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pa-mk [data-settings-view] button:focus-visible,
.pa-mk [data-settings-view] input:focus-visible,
.pa-mk [data-settings-view] summary:focus-visible,
.pa-mk .pa-ask button:focus-visible { outline: 2px solid var(--wb-primary); outline-offset: 1px; }

/* Mockup-only chrome (mk-*): not part of the product */
.pa-mk .mk-bar { margin: 0 max(14px, calc((100% - 1280px) / 2)) 10px; padding: 8px 12px; border: 1px dashed var(--wb-line); border-radius: 10px; background: color-mix(in srgb, var(--wb-muted) 30%, var(--wb-bg)); display: flex; flex-direction: column; gap: 6px; }
.pa-mk .mk-title { font-size: 11px; font-weight: 800; color: var(--wb-muted-fg); letter-spacing: .02em; }
.pa-mk .mk-grp { display: flex; align-items: center; gap: 4px 6px; flex-wrap: wrap; }
.pa-mk .mk-lbl { flex: 0 0 104px; font-size: 11px; font-weight: 700; color: var(--wb-muted-fg); word-break: keep-all; }
.pa-mk .mk-btn { height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--wb-line); background: transparent; color: var(--wb-muted-fg); font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.pa-mk .mk-btn:hover { color: var(--wb-fg); background: var(--wb-wash); }
.pa-mk .mk-btn[aria-pressed="true"] { background: color-mix(in srgb, var(--wb-primary) 14%, var(--wb-card)); border-color: color-mix(in srgb, var(--wb-primary) 48%, transparent); color: var(--wb-primary); }
.pa-mk .mk-note { margin: 0 max(14px, calc((100% - 1280px) / 2)) 4px; font-size: 10.5px; font-weight: 700; color: var(--wb-muted-fg); }

/* Live settings page primitives (dashboard-settings.css, abridged) */
.pa-mk .page { padding: 0 14px; }
.pa-mk .stage { background: var(--wb-card); border-radius: var(--wb-radius); box-shadow: var(--wb-shadow); border: 1px solid color-mix(in srgb, var(--wb-line) 55%, transparent); display: flex; flex-direction: column; width: 100%; max-width: 1280px; margin-inline: auto; min-width: 0; overflow: hidden; }
.pa-mk .shd-top { min-height: 42px; padding: 5px 16px; display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; border-bottom: 1px solid color-mix(in srgb, var(--wb-muted) 80%, transparent); }
.pa-mk .shd-title { display: flex; align-items: center; gap: 7px; min-width: 0; }
.pa-mk .shd-title > .i { width: 15px; height: 15px; color: var(--wb-primary); }
.pa-mk .shd-title h1 { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; }
.pa-mk .route-pill { font-family: var(--wb-mono); font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: var(--wb-wash); color: var(--wb-muted-fg); white-space: nowrap; }
.pa-mk .btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 28px; padding: 0 11px; border-radius: 7px; border: 1px solid var(--wb-line); background: var(--wb-card); color: var(--wb-fg); font-size: 11.5px; font-weight: 700; cursor: pointer; white-space: nowrap; word-break: keep-all; }
.pa-mk .btn:hover:not(:disabled) { background: var(--wb-muted); }
.pa-mk .btn.pri { background: var(--wb-primary); color: var(--wb-primary-fg); border-color: var(--wb-primary); }
.pa-mk .btn.pri:hover:not(:disabled) { filter: brightness(1.06); }
.pa-mk .btn:disabled { opacity: .48; cursor: not-allowed; }
.pa-mk .seg { display: inline-flex; align-items: center; gap: 2px; width: fit-content; max-width: 100%; height: 30px; padding: 2px; border-radius: 8px; background: var(--wb-muted); }
.pa-mk .seg button { display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 6px; height: 26px; padding: 0 10px; font-size: 11.5px; font-weight: 700; color: var(--wb-muted-fg); cursor: pointer; white-space: nowrap; font-family: var(--wb-mono); }
.pa-mk .seg button:hover { color: var(--wb-fg); }
.pa-mk .seg button[aria-pressed="true"] { background: var(--wb-card); color: var(--wb-fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12), inset 0 0 0 1px color-mix(in srgb, var(--wb-line) 70%, transparent); }

.pa-mk .sbody { display: grid; grid-template-columns: 172px minmax(0, 1fr); }
.pa-mk .snav { border-right: 1px solid var(--wb-muted); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; background: color-mix(in srgb, var(--wb-muted) 12%, var(--wb-card)); }
.pa-mk .snav-btn { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; border: 0; border-radius: 7px; padding: 6px 8px; background: transparent; color: var(--wb-muted-fg); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.pa-mk .snav-btn:hover { background: var(--wb-wash); color: var(--wb-fg); }
.pa-mk .snav-btn[aria-current="true"] { background: color-mix(in srgb, var(--wb-primary) 13%, var(--wb-card)); color: var(--wb-primary); font-weight: 700; }
.pa-mk .snav-btn .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--wb-primary); flex: none; }
.pa-mk .snav-btn .dot.none { background: transparent; }
.pa-mk .snav-btn .cnt { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--wb-muted-fg); padding: 0 5px; border-radius: 999px; background: var(--wb-wash); font-variant-numeric: tabular-nums; }
.pa-mk .snav-btn .cnt:empty { display: none; }
.pa-mk .snav-btn .cnt.warn { background: color-mix(in srgb, var(--wb-warn) 18%, var(--wb-card)); color: var(--wb-warn-ink); }
.pa-mk .scontent { min-width: 0; padding: 10px 18px 24px; display: flex; flex-direction: column; gap: 9px; }

.pa-mk .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 2px 2px 3px; }
.pa-mk .sec-head h2 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: -.01em; word-break: keep-all; }
.pa-mk .sec-head p { margin: 0; font-size: 11px; color: var(--wb-muted-fg); word-break: keep-all; }

.pa-mk .sgroup { border: 1px solid color-mix(in srgb, var(--wb-line) 75%, transparent); border-radius: 10px; background: var(--wb-card); overflow: hidden; }
.pa-mk .srow { display: grid; grid-template-columns: minmax(0, 1fr) 396px; gap: 0 18px; align-items: center; padding: 9px 16px; background: var(--wb-card); transition: background .1s, box-shadow .2s; }
.pa-mk .srow + .srow { border-top: 1px solid color-mix(in srgb, var(--wb-muted) 82%, transparent); }
.pa-mk .srow:hover { background: color-mix(in srgb, var(--wb-fg) 2%, var(--wb-card)); }
.pa-mk .srow.overridden { box-shadow: inset 3px 0 0 var(--wb-primary); background: color-mix(in srgb, var(--wb-primary) 5%, var(--wb-card)); }
.pa-mk .srow.attn { box-shadow: inset 3px 0 0 var(--wb-warn); background: color-mix(in srgb, var(--wb-warn) 5%, var(--wb-card)); }
.pa-mk .srow.pa-flash { box-shadow: inset 3px 0 0 var(--wb-primary), inset 0 0 0 1.5px color-mix(in srgb, var(--wb-primary) 55%, transparent); }
.pa-mk .kmeta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pa-mk .klabel-line { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; min-width: 0; }
.pa-mk .klabel { font-size: 13px; font-weight: 700; word-break: keep-all; }
.pa-mk .skey { font-family: var(--wb-mono); font-size: 11px; font-weight: 500; color: var(--wb-muted-fg); background: color-mix(in srgb, var(--wb-muted) 55%, transparent); padding: 0 5px; border-radius: 4px; line-height: 17px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.pa-mk .tag { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; line-height: 16px; padding: 0 6px; border-radius: 999px; background: var(--wb-muted); color: var(--wb-muted-fg); white-space: nowrap; }
.pa-mk .kdesc { margin: 0; font-size: 12px; color: var(--wb-muted-fg); line-height: 1.38; word-break: keep-all; }
.pa-mk .inline-warn { margin-top: 4px; padding: 4px 9px; border-radius: 6px; background: color-mix(in srgb, var(--wb-warn) 12%, var(--wb-card)); border: 1px solid color-mix(in srgb, var(--wb-warn) 36%, transparent); color: var(--wb-warn-ink); font-size: 11px; line-height: 1.35; word-break: keep-all; }
.pa-mk .inline-warn.fail { background: color-mix(in srgb, var(--wb-fail) 10%, var(--wb-card)); border-color: color-mix(in srgb, var(--wb-fail) 36%, transparent); color: var(--wb-fail); }
.pa-mk .hint { font-size: 11px; color: var(--wb-muted-fg); line-height: 1.35; word-break: keep-all; }
.pa-mk .hint:empty { display: none; }
.pa-mk .hint.err { color: var(--wb-fail); font-weight: 700; }
.pa-mk .hint.warn { color: var(--wb-warn-ink); font-weight: 700; }
.pa-mk .hint.ok { color: var(--wb-ok); font-weight: 700; }
.pa-mk .inp { width: 100%; height: 30px; padding: 0 9px; border: 1px solid var(--wb-line); border-radius: 7px; background: var(--wb-bg); color: var(--wb-fg); font-size: 12px; min-width: 0; }
.pa-mk .inp.mono { font-family: var(--wb-mono); }
.pa-mk .inp:focus-visible { outline: 1.5px solid var(--wb-primary); outline-offset: -1px; }
.pa-mk .inp.bad { border-color: color-mix(in srgb, var(--wb-fail) 60%, transparent); }
.pa-mk .inp.soft { border-color: color-mix(in srgb, var(--wb-warn) 60%, transparent); }
.pa-mk .inp:disabled { opacity: .62; cursor: not-allowed; }
.pa-mk .tg { position: relative; width: 36px; height: 20px; border-radius: 999px; border: 0; padding: 0; cursor: pointer; flex: none; background: color-mix(in srgb, var(--wb-fg) 22%, var(--wb-card)); transition: background .12s; }
.pa-mk .tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--wb-card); box-shadow: 0 1px 2px rgb(0 0 0 / .3); transition: left .12s; }
.pa-mk .tg[aria-checked="true"] { background: var(--wb-primary); }
.pa-mk .tg[aria-checked="true"]::after { left: 19px; }
.pa-mk .tg:disabled { opacity: .45; cursor: not-allowed; }
.pa-mk .tgl { font-size: 12px; font-weight: 600; word-break: keep-all; }
.pa-mk .origin-pill { min-width: 0; height: 26px; padding: 0 9px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--wb-line) 75%, transparent); background: var(--wb-wash); color: var(--wb-muted-fg); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
.pa-mk .origin-pill > .lbl { overflow: hidden; text-overflow: ellipsis; }
.pa-mk .origin-pill .i { width: 11px; height: 11px; }

/* Tier matrix (dashboard-settings.css .tier-*): existing picker, abridged */
.pa-mk .tier-group-head { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 10px; border-bottom: 1px solid color-mix(in srgb, var(--wb-muted) 90%, transparent); background: color-mix(in srgb, var(--wb-muted) 22%, var(--wb-card)); }
.pa-mk .tier-htabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pa-mk .tier-htab { appearance: none; text-align: left; cursor: pointer; background: var(--wb-bg); border: 1px solid var(--wb-line); border-radius: 8px; padding: 8px 10px; color: var(--wb-fg); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pa-mk .tier-htab[aria-selected="true"] { background: color-mix(in srgb, var(--wb-primary) 11%, var(--wb-card)); border-color: var(--wb-primary); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--wb-primary) 28%, transparent); }
.pa-mk .tier-htab-id { font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.pa-mk .tier-htab-sub { font-family: var(--wb-mono); font-size: 10.5px; color: var(--wb-muted-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pa-mk .tier-scroll { overflow-x: auto; }
.pa-mk .tier-tbl { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 560px; }
.pa-mk .tier-tbl th { text-align: left; font-size: 11px; font-weight: 700; color: var(--wb-muted-fg); padding: 7px 8px; border-bottom: 1px solid color-mix(in srgb, var(--wb-muted) 85%, transparent); white-space: nowrap; }
.pa-mk .tier-tbl th:first-child, .pa-mk .tier-tbl td:first-child { padding-left: 16px; }
.pa-mk .tier-tbl td { padding: 7px 8px; border-bottom: 1px solid color-mix(in srgb, var(--wb-muted) 70%, transparent); }
.pa-mk .tier-tbl tr:last-child td { border-bottom: 0; }
.pa-mk .tier-tbl td.tname { font-family: var(--wb-mono); font-weight: 800; width: 80px; }
.pa-mk .tier-tbl .inp { height: 29px; }
.pa-mk .tier-tbl tr.pa-flash td { background: color-mix(in srgb, var(--wb-primary) 9%, var(--wb-card)); }
.pa-mk .tier-tbl tr.pa-flash td:first-child { box-shadow: inset 3px 0 0 var(--wb-primary); }

/* Provider auth (pa-*): built only from the primitives above */
.pa-mk .pa-rail { display: flex; align-items: center; justify-content: flex-end; gap: 8px; width: 396px; min-width: 0; flex-wrap: wrap; }
.pa-mk .pa-rail .origin-pill { flex: 1 1 auto; }
.pa-mk .pa-rail .origin-pill.here { flex: 0 1 auto; background: color-mix(in srgb, var(--wb-primary) 14%, var(--wb-card)); border-color: color-mix(in srgb, var(--wb-primary) 40%, transparent); color: var(--wb-primary); }
.pa-mk .pa-rail > .hint { flex-basis: 100%; text-align: right; }
.pa-mk .origin-pill.ok { background: color-mix(in srgb, var(--wb-ok) 12%, var(--wb-card)); border-color: color-mix(in srgb, var(--wb-ok) 38%, transparent); color: var(--wb-ok); }
.pa-mk .origin-pill.unset { background: color-mix(in srgb, var(--wb-warn) 12%, var(--wb-card)); border-color: color-mix(in srgb, var(--wb-warn) 36%, transparent); color: var(--wb-warn-ink); }
.pa-mk .origin-pill.fail { background: color-mix(in srgb, var(--wb-fail) 11%, var(--wb-card)); border-color: color-mix(in srgb, var(--wb-fail) 36%, transparent); color: var(--wb-fail); }
.pa-mk .origin-pill.busy { background: color-mix(in srgb, var(--wb-primary) 12%, var(--wb-card)); border-color: color-mix(in srgb, var(--wb-primary) 40%, transparent); color: var(--wb-primary); }
.pa-mk .origin-pill .tail, .pa-mk .tail { font-family: var(--wb-mono); font-weight: 600; }
.pa-mk .pa-spin { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: pa-mk-spin .8s linear infinite; flex: none; }
@keyframes pa-mk-spin { to { transform: rotate(360deg); } }

.pa-mk .pa-link { align-self: flex-start; margin-top: 3px; display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: transparent; color: var(--wb-primary); font-size: 11px; font-weight: 700; cursor: pointer; }
.pa-mk .pa-link:hover { text-decoration: underline; }
.pa-mk .pa-link .i { width: 11px; height: 11px; }

/* 28x28 icon button (reset-icon-btn geometry); radial hold-to-confirm fill */
.pa-mk .pa-ibtn { position: relative; overflow: hidden; flex: 0 0 28px; width: 28px; height: 28px; padding: 0; border-radius: 7px; border: 1px solid color-mix(in srgb, var(--wb-line) 85%, transparent); background: transparent; color: var(--wb-muted-fg); display: inline-grid; place-items: center; cursor: pointer; }
.pa-mk .pa-ibtn:hover { background: var(--wb-muted); color: var(--wb-fg); }
.pa-mk .pa-ibtn > .i { position: relative; z-index: 1; }
.pa-mk .pa-ibtn.plain { border-color: transparent; }
.pa-mk .pa-ibtn.danger:hover { color: var(--wb-fail); border-color: color-mix(in srgb, var(--wb-fail) 45%, transparent); }
.pa-mk .pa-ibtn.d-hold-btn::before { content: ""; position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: color-mix(in srgb, var(--wb-fail) 34%, transparent); transform: scale(0); pointer-events: none; }
.pa-mk .pa-ibtn.d-hold-btn.d-hold-active::before { animation: pa-mk-hold var(--d-hold-dur, 1500ms) linear forwards; }
.pa-mk .pa-ibtn.d-hold-btn.d-hold-ready { color: var(--wb-card); border-color: var(--wb-fail); }
.pa-mk .pa-ibtn.d-hold-btn.d-hold-ready::before { background: var(--wb-fail); transform: scale(1); animation: none; }
@keyframes pa-mk-hold { from { transform: scale(0); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  .pa-mk .pa-ibtn.d-hold-btn.d-hold-active::before { animation: none; transform: scale(1); opacity: .45; }
  .pa-mk .pa-spin { animation-duration: 2.4s; }
  .pa-mk .srow, .pa-mk .tg, .pa-mk .tg::after { transition: none; }
}

/* Full-width editor strip under a row (layer-drawer geometry) */
.pa-mk .pa-drawer { grid-column: 1 / -1; margin: 9px -16px -9px; padding: 9px 16px 10px; background: color-mix(in srgb, var(--wb-muted) 42%, var(--wb-bg)); border-top: 1px solid color-mix(in srgb, var(--wb-line) 60%, transparent); display: flex; flex-direction: column; gap: 6px; }
.pa-mk .pa-form { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.pa-mk .pa-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pa-mk .pa-field > label { font-size: 10.5px; font-weight: 800; color: var(--wb-muted-fg); }
.pa-mk .pa-field.key { flex: 1 1 300px; max-width: 460px; }
.pa-mk .pa-actions { display: flex; align-items: center; gap: 6px; padding-top: 17px; }
.pa-mk .pa-note { font-size: 11.5px; color: var(--wb-muted-fg); line-height: 1.45; word-break: keep-all; margin: 0; }
.pa-mk .pa-note b { color: var(--wb-fg); }

/* Consent sub-row under the OpenAI row */
.pa-mk .srow.pa-sub { padding-left: 34px; background: color-mix(in srgb, var(--wb-muted) 10%, var(--wb-card)); }
.pa-mk .pa-sub .klabel { font-size: 12.5px; }
.pa-mk .pa-sub .pa-rail { justify-content: flex-start; }

/* Dashboard-wide consent request banner (repo-banner geometry, primary tint) */
.pa-mk .pa-shell { margin: 0 max(14px, calc((100% - 1280px) / 2)) 10px; }
.pa-mk .pa-shell .mk-note { margin: 0 0 4px; }
.pa-mk .pa-ask { padding: 9px 8px 9px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--wb-primary) 42%, transparent); background: color-mix(in srgb, var(--wb-primary) 8%, var(--wb-card)); box-shadow: inset 3px 0 0 var(--wb-primary), var(--wb-shadow); display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.pa-mk .pa-ask-text { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.pa-mk .pa-ask-title { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; color: var(--wb-fg); word-break: keep-all; }
.pa-mk .pa-ask-title .i { color: var(--wb-primary); }
.pa-mk .pa-ask-desc { margin: 0; font-size: 11.5px; line-height: 1.45; color: var(--wb-fg); word-break: keep-all; }

        '<p class="kdesc">ChatGPT 요금제로 내 에이전트 세션(Werk 하네스)을 실행합니다. 웹 검색·이미지 같은 도구는 이 계정을 쓰지 않습니다.</p>' +
        tierLink("openai", "Werk 티어에서 OpenAI 모델 선택") + warn +
      '</div><div class="pa-rail">' + pill + ctl + '</div>' + drawer + '</div>' + consentRow();
  }

  function consentRow() {
    var st = S.oa;
    if (st === "out" || st === "remote" || st === "pending" || st === "failed") return "";
    var on = S.cs === "yes", usable = st === "in" || st === "noemail";
    var state = S.cs === "yes" ? "허용됨" : S.cs === "no" ? "허용 안 함" : "아직 묻지 않음";
    var note = usable ? "" : '<span class="hint">다시 로그인해도 이 답은 유지됩니다.</span>';
    return '<div class="srow pa-sub" data-row="openai-consent"><div class="kmeta">' +
        '<div class="klabel-line"><span class="klabel">백그라운드 세션에서 사용</span><span class="tag">' + state + '</span></div>' +
        '<p class="kdesc">워커, 예약 작업처럼 직접 조작하지 않는 세션도 이 계정의 ChatGPT 요금제를 쓸 수 있게 합니다. 끄면 그런 세션은 실행 전에 이유를 남기고 멈춥니다.</p>' +
      '</div><div class="pa-rail">' +
        '<button type="button" class="tg" role="switch" aria-checked="' + on + '" data-act="cs-toggle" aria-label="백그라운드 세션에서 사용"' + (usable ? "" : " disabled") + '></button>' +
        '<span class="tgl">' + (on ? "켜짐" : "꺼짐") + '</span>' + note +
      '</div></div>';
  }

  function consentBanner() {
    if (S.cs !== "ask") return "";
    return '<div class="mk-note">(목업 주석) 이 배너는 설정 화면만이 아니라 대시보드 모든 화면 상단에 표시됩니다.</div>' +
      '<div class="pa-ask" role="region" aria-label="백그라운드 사용 동의 요청"><div class="pa-ask-text">' +
        '<span class="pa-ask-title">' + IC.ask + '백그라운드 세션이 OpenAI 계정을 쓰려고 합니다</span>' +
        '<p class="pa-ask-desc">워커 <code>wrk-7c1e</code>(티어 <code>medium</code>, <code>openai gpt-5.1-codex</code>)가 ' + EMAIL + '의 ChatGPT 요금제로 실행하려다 멈췄습니다. 허용하면 앞으로 워커와 예약 작업도 이 계정을 씁니다. 설정에서 언제든 끌 수 있습니다.</p>' +
        '<button type="button" class="pa-link" data-act="goto-openai">설정에서 OpenAI 보기' + IC.arrow + '</button>' +
      '</div><div class="pa-ask-btns">' +
        '<button type="button" class="btn pri" data-act="cs-yes">허용</button>' +
        '<button type="button" class="btn" data-act="cs-no">허용 안 함</button>' +
        '<button type="button" class="pa-ibtn plain" data-act="cs-close" title="닫기: 다음에 백그라운드 세션이 거부되면 다시 표시됩니다" aria-label="닫기">' + IC.x + '</button>' +
      '</div></div>';
  }

  /* Local endpoints */
  var EPS = [
    { name: "ollama-box", url: "http://localhost:11434/v1", kind: "ollama", key: "" },
    { name: "lab-vllm", url: "https://vllm.lab.internal:8000/v1", kind: "vllm", key: "...9f3c" }
  ];
  function epRow(ep, editing) {
    var key = ep.key ? '<span class="key set">키 설정됨 <span class="tail">' + ep.key + '</span></span>' : '<span class="key">키 없음</span>';
    var del = ep.name + " 삭제" + (ep.key ? " (저장된 API 키도 함께 삭제)" : "");
    return '<div class="pa-ep' + (editing ? " editing" : "") + '">' +
      '<div class="nm"><b>' + ep.name + '</b><span>local/' + ep.name + '</span></div>' +
      '<div class="url" title="' + ep.url + '">' + ep.url + '</div>' +
      '<div class="kind">' + ep.kind + '</div>' + key +
      '<div class="acts"><button type="button" class="pa-ibtn" data-act="ep-edit" title="편집" aria-label="' + ep.name + ' 편집">' + IC.pen + '</button>' + holdBtn("ep-remove", del) + '</div>' +
    '</div>';
  }
  function epEditor(mode) {
    var isNew = mode === "add" || mode === "invalid";
    var name = "", url = "", kind = "ollama", nameCls = "inp mono", urlCls = "inp mono", urlWarn = "";
    var nameHint = '<span class="hint">소문자·숫자·하이픈, 첫 글자는 문자나 숫자, 최대 64자</span>';
    var urlHint = '<span class="hint">http(s) 절대 주소 · 사용자 정보, 쿼리, # 없이 · 끝의 / 는 지워집니다</span>';
    var keyLabel = "API 키 (선택)", keyPh = "없으면 비워 두세요", keyHint = '<span class="hint">이 주소로만 보냅니다</span>';
    if (mode === "invalid") {
      name = "My_Box"; nameCls += " bad"; nameHint = '<span class="hint err">소문자, 숫자, 하이픈만 쓸 수 있습니다.</span>';
      url = "localhost:11434/v1?stream=1"; urlCls += " bad"; urlHint = '<span class="hint err">http:// 또는 https://로 시작하고 쿼리(?)가 없어야 합니다.</span>';
    }
    if (mode === "edit") {
      name = "lab-vllm"; url = "https://vllm2.lab.internal:8000/v1"; kind = "vllm"; urlCls += " soft";
      keyLabel = "API 키"; keyPh = "새 주소용 키 입력"; keyHint = '<span class="hint">비워 두면 키 없이 연결합니다</span>';
      urlWarn = '<div class="inline-warn">주소가 바뀌었습니다. 기존 키(<span class="tail">...9f3c</span>)는 새 주소로 보내지 않고 저장할 때 삭제합니다. 새 주소에 키가 필요하면 입력하세요.</div>';
    }
    var seg = '<div class="seg" role="group" aria-label="종류">' +
      '<button type="button" data-act="ep-kind" aria-pressed="' + (kind === "vllm") + '">vllm</button>' +
      '<button type="button" data-act="ep-kind" aria-pressed="' + (kind === "ollama") + '">ollama</button></div>';
    return '<div class="pa-ep-edit"><div class="pa-ep-grid">' +
        '<div class="pa-field"><label for="pa-mk-ep-name">이름</label><input id="pa-mk-ep-name" class="' + nameCls + '" value="' + name + '" placeholder="ollama-box" spellcheck="false">' + nameHint + '</div>' +
        '<div class="pa-field"><label for="pa-mk-ep-url">기본 URL</label><input id="pa-mk-ep-url" class="' + urlCls + '" value="' + url + '" placeholder="http://localhost:11434/v1" spellcheck="false">' + urlHint + '</div>' +
        '<div class="pa-field"><label>종류</label>' + seg + '</div>' +
        '<div class="pa-field"><label for="pa-mk-ep-key">' + keyLabel + '</label><input id="pa-mk-ep-key" class="inp mono" type="password" autocomplete="off" placeholder="' + keyPh + '">' + keyHint + '</div>' +
      '</div>' + urlWarn +
      '<div class="pa-ep-foot">' +
        '<button type="button" class="btn pri" data-act="ep-save"' + (mode === "invalid" ? " disabled" : "") + '>' + (isNew ? "추가" : "저장") + '</button>' +
        '<button type="button" class="btn" data-act="ep-cancel">취소</button>' +
      '</div></div>';
  }
  function endpointsRow() {
    var st = S.ep, list;
    if (st === "empty") list = '<div class="pa-ep-empty">등록된 로컬 엔드포인트가 없습니다.</div>';
    else {
      list = '<div class="pa-ep head"><span>이름</span><span>기본 URL</span><span>종류</span><span>API 키</span><span></span></div>' +
        epRow(EPS[0], false) + epRow(EPS[1], st === "edit") + (st === "edit" ? epEditor("edit") : "");
    }
    if (st === "add" || st === "invalid") list += epEditor(st);
    var json = {};
    (st === "empty" ? [] : EPS).forEach(function (e) { json[e.name] = { base_url: e.url, kind: e.kind }; });
    var add = (st === "add" || st === "invalid" || st === "edit") ? "" : '<button type="button" class="btn" data-act="ep-add">+ 엔드포인트</button>';
    return '<div class="srow" data-row="werk-endpoints"><div class="kmeta">' +
        '<div class="klabel-line"><span class="klabel">Werk 로컬 엔드포인트</span><code class="skey">agent.werk_endpoints</code><span class="tag">' + (st === "empty" ? 0 : 2) + '개</span></div>' +
        '<p class="kdesc">직접 운영하는 vLLM·Ollama 서버입니다. 각 엔드포인트는 프로바이더 <code>local/&lt;이름&gt;</code>으로 티어에서 고를 수 있습니다.</p>' +
        tierLink("local", "Werk 티어에서 로컬 모델 선택") +
      '</div><div class="pa-rail"><span class="origin-pill here"><span class="lbl">전역</span></span></div>' +
      '<div class="pa-eps">' + list + '<div class="pa-ep-add">' + add +
        '<details class="pa-json"><summary>저장 형식(JSON) 보기</summary><pre>' + JSON.stringify(json, null, 2).replace(/</g, "&lt;") + '</pre></details>' +
      '</div></div></div>';
  }

  /* Tier matrix: the existing picker, abridged and unchanged */
  var TIERS = [
    { t: "small", model: "local/ollama-box qwen3:32b", effort: "—", p: "local" },
    { t: "medium", model: "openai gpt-5.1-codex", effort: "medium", p: "openai" },
    { t: "large", model: "openrouter anthropic/claude-opus-4.5", effort: "high", p: "openrouter" },
    { t: "xlarge", model: "openai gpt-5.1-codex-max", effort: "xhigh", p: "openai" }
  ];
  function tierBlock() {
    var rows = TIERS.map(function (r) {
      return '<tr data-prov="' + r.p + '"><td class="tname">' + r.t + '</td>' +
        '<td><input class="inp mono" value="werk" aria-label="' + r.t + ' 백엔드"></td>' +
        '<td><input class="inp mono" value="' + r.model + '" aria-label="' + r.t + ' 모델"></td>' +
        '<td><input class="inp mono" value="' + r.effort + '" aria-label="' + r.t + ' 추론 강도"></td></tr>';
    }).join("");
    return '<div class="sgroup" data-slot="tiers"><div class="tier-group-head">' +
        '<div class="klabel-line"><span class="klabel">능력 티어 매트릭스</span><code class="skey">agents.tier</code><span class="tag">기존 화면 · 변경 없음</span></div>' +
        '<div class="tier-htabs" role="tablist">' +
          '<button type="button" class="tier-htab" role="tab" aria-selected="false"><span class="tier-htab-id">Claude</span><span class="tier-htab-sub">sonnet · opus</span></button>' +
          '<button type="button" class="tier-htab" role="tab" aria-selected="false"><span class="tier-htab-id">Codex</span><span class="tier-htab-sub">gpt-5.1-codex</span></button>' +
          '<button type="button" class="tier-htab" role="tab" aria-selected="false"><span class="tier-htab-id">AgY</span><span class="tier-htab-sub">gemini-3-pro</span></button>' +
          '<button type="button" class="tier-htab" role="tab" aria-selected="true"><span class="tier-htab-id">Werk</span><span class="tier-htab-sub">openrouter · openai · local</span></button>' +
        '</div></div>' +
      '<div class="tier-scroll"><table class="tier-tbl"><thead><tr><th>티어</th><th>백엔드</th><th>모델</th><th>추론 강도</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }

  function render() {
    if (S.theme === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", S.theme);
    var attention = (S.or === "unset" ? 1 : 0) + ((S.oa === "reauth" || S.oa === "plan") ? 1 : 0) + (S.cs === "ask" ? 1 : 0);
    var cnt = $('[data-slot="navcnt"]');
    cnt.textContent = attention ? String(attention) : "";
    cnt.className = "cnt" + (attention ? " warn" : "");
    var shell = $('[data-slot="shell"]');
    shell.className = S.cs === "ask" ? "pa-shell" : "";
    shell.innerHTML = consentBanner();
    $('[data-slot="content"]').innerHTML =
      '<div class="sec-head"><h2>에이전트 · 티어</h2><p>프로바이더 자격 증명은 이 컴퓨터의 데몬에만 저장됩니다.</p></div>' +
      '<div class="sec-head"><h2>프로바이더 자격 증명</h2></div>' +
      '<div class="sgroup">' + openRouterRow() + openAIRow() + '</div>' +
      '<div class="sgroup">' + endpointsRow() + '</div>' +
      tierBlock() +
      '<div class="sgroup"><div class="srow"><div class="kmeta"><div class="klabel-line"><span class="klabel">자식 대기 일수</span><code class="skey">agent.child_waiting_days</code></div><p class="kdesc">(기존 행 · 문맥용)</p></div><div class="pa-rail"><span class="origin-pill"><span class="lbl">내장 기본값</span></span></div></div></div>';
    // Demo-only: put the typed value of an error state into the field after render.
    var k = $("[data-or-key]");
    if (k && k.dataset.val) { k.value = k.dataset.val; k.removeAttribute("data-val"); }
    $$(".mk-grp").forEach(function (g) {
      g.querySelectorAll(".mk-btn").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.v === S[g.dataset.mk])); });
    });
  }

  function flash(el) {
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("pa-flash");
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { el.classList.remove("pa-flash"); }, 1800);
  }

  $("[data-mk-bar]").addEventListener("click", function (e) {
    var b = e.target.closest(".mk-btn"); if (!b) return;
    var g = b.closest(".mk-grp").dataset.mk;
    clearTimeout(verifyTimer);
    S[g] = b.dataset.v;
    var signedIn = S.oa === "in" || S.oa === "noemail";
    if (g === "cs" && b.dataset.v !== "none" && !signedIn) S.oa = "in";
    if (g === "oa" && S.cs === "ask" && !signedIn) S.cs = "none";
    render();
  });

  var ACT = {
    "or-entry": function () { S.or = "entry"; },
    "or-replace": function () { S.or = "replace"; },
    "or-cancel": function () { S.or = (S.or === "replace") ? "set" : "unset"; },
    "or-save": function () {
      var v = ($("[data-or-key]") || {}).value || "";
      if (!v) return false;
      S.or = "verifying";
      clearTimeout(verifyTimer);
      verifyTimer = setTimeout(function () { if (S.or === "verifying") { S.or = "saved"; render(); } }, 1200);
    },
    "oa-signin": function () { S.oa = "pending"; },
    "oa-cancel": function () { S.oa = "out"; },
    "cs-yes": function () { S.cs = "yes"; },
    "cs-no": function () { S.cs = "no"; },
    "cs-close": function () { S.cs = "none"; },
    "cs-toggle": function () { S.cs = S.cs === "yes" ? "no" : "yes"; },
    "goto-openai": function () { flash($('[data-row="openai"]')); return false; },
    "ep-add": function () { S.ep = "add"; },
    "ep-edit": function () { S.ep = "edit"; },
    "ep-cancel": function () { S.ep = "list"; },
    "ep-save": function () { S.ep = "list"; },
    "ep-kind": function (b) { b.parentNode.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); return false; },
    "tier": function (b) {
      var box = $('[data-slot="tiers"]');
      box.scrollIntoView({ behavior: "smooth", block: "start" });
      box.querySelectorAll("tr[data-prov]").forEach(function (tr) { tr.classList.toggle("pa-flash", tr.dataset.prov === b.dataset.provider); });
      return false;
    }
  };
  root.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b || b.disabled || !root.contains(b)) return;
    var fn = ACT[b.dataset.act]; if (!fn) return;
    if (fn(b) !== false) render();
  });
  root.addEventListener("input", function (e) {
    if (!e.target.hasAttribute("data-or-key")) return;
    var v = e.target.value.trim(), hint = e.target.parentNode.querySelector(".hint");
    var soft = v !== "" && v.indexOf("sk-or-") !== 0;
    e.target.classList.toggle("soft", soft); e.target.classList.remove("bad");
    hint.className = "hint" + (soft ? " warn" : "");
    hint.textContent = soft ? OR_PREFIX : OR_HINT;
  });

  /* Hold-to-confirm: WsHoldConfirm behavior, 1.5 s */
  var HOLD_MS = 1500, hold = null;
  var DONE = {
    "or-remove": function () { S.or = "unset"; },
    "oa-signout": function () { S.oa = "out"; S.cs = "none"; },
    "ep-remove": function () { S.ep = "list"; }
  };
  function cancelHold() {
    if (!hold) return;
    clearTimeout(hold.timer); hold.el.classList.remove("d-hold-active", "d-hold-ready"); hold = null;
  }
  function startHold(el) {
    cancelHold();
    el.style.setProperty("--d-hold-dur", HOLD_MS + "ms");
    el.classList.add("d-hold-active");
    hold = { el: el, timer: setTimeout(function () {
      el.classList.add("d-hold-ready");
      hold.timer = setTimeout(function () { var a = el.dataset.hold; hold = null; if (DONE[a]) { DONE[a](); render(); } }, 160);
    }, HOLD_MS) };
  }
  function ready() { return hold && hold.el.classList.contains("d-hold-ready"); }
  root.addEventListener("pointerdown", function (e) { var b = e.target.closest("[data-hold]"); if (b) { e.preventDefault(); startHold(b); } });
  ["pointerup", "pointercancel"].forEach(function (t) { root.addEventListener(t, function () { if (!ready()) cancelHold(); }); });
  root.addEventListener("pointerleave", function (e) { if (hold && e.target === hold.el && !ready()) cancelHold(); }, true);
  root.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { cancelHold(); return; }
    var b = e.target.closest && e.target.closest("[data-hold]");
    if (b && (e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); startHold(b); }
  });
  root.addEventListener("keyup", function (e) { if ((e.key === " " || e.key === "Enter") && !ready()) cancelHold(); });
  window.addEventListener("blur", cancelHold);
  document.addEventListener("visibilitychange", cancelHold);

  render();
})();
</script>
</div>
