<style>
/* ==========================================================================
   Tokens: wswhiteboard page.css + dashboard-settings.css overrides
   ========================================================================== */
:root {
  --wb-bg: #f3f3f0; --wb-fg: #1b1d21; --wb-card: #ffffff; --wb-muted: #e9e8e3; --wb-muted-fg: #5f646b;

  --wb-policy: #b25000; --wb-on-policy: #ffffff;
  --wb-technical: #2457c5; --wb-on-technical: #ffffff;
  --wb-ok: #1d7348; --wb-fail: #a72e36; --wb-warn: #986300; --wb-warn-ink: #7a4c00;
  --wb-shadow: 0 1px 2px rgb(0 0 0 / .10), 0 2px 6px rgb(0 0 0 / .05);
  --wb-shadow-hi: 0 4px 12px rgb(0 0 0 / .16), 0 12px 32px rgb(0 0 0 / .12);
  --wb-radius: 12px;
  --wb-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --wb-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --wb-bg: #141518; --wb-fg: #e7e7e4; --wb-card: #1e2024; --wb-muted: #2b2d32; --wb-muted-fg: #a2a6ad;
  --wb-primary: #7aa2ff; --wb-primary-fg: #0c1424;
  --wb-policy: #5b3a1c; --wb-on-policy: #f6d9bd;
  --wb-technical: #26385e; --wb-on-technical: #d2dcf6;
  --wb-ok: #6cc39a; --wb-fail: #f1888e; --wb-warn: #e0a741; --wb-warn-ink: #f6c76b;
  --wb-shadow: 0 1px 2px rgb(0 0 0 / .45), 0 2px 8px rgb(0 0 0 / .25);
  --wb-shadow-hi: 0 6px 18px rgb(0 0 0 / .55), 0 14px 36px rgb(0 0 0 / .42);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--wb-bg); color: var(--wb-fg); font: 13px/1.45 var(--wb-sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--wb-mono); }
.i { width: 14px; height: 14px; flex: none; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
[data-settings-view] button:focus-visible, [data-settings-view] input:focus-visible,
[data-settings-view] textarea:focus-visible, [data-settings-view] summary:focus-visible { outline: 2px solid var(--wb-primary); outline-offset: 1px; }

/* ==========================================================================
   Mockup-only chrome: state switcher (not part of the product)
   ========================================================================== */
.mk-bar {
  max-width: 1280px; margin: 10px auto 10px; padding: 8px 12px;
  border: 1px dashed var(--wb-line); border-radius: 10px;
  background: color-mix(in srgb, var(--wb-muted) 30%, var(--wb-bg));
  display: flex; flex-direction: column; gap: 6px;
}
.mk-title { font-size: 11px; font-weight: 800; color: var(--wb-muted-fg); letter-spacing: .02em; }
.mk-grp { display: flex; align-items: center; gap: 4px 6px; flex-wrap: wrap; }
.mk-lbl { flex: 0 0 104px; font-size: 11px; font-weight: 700; color: var(--wb-muted-fg); word-break: keep-all; }
.mk-btn {
  height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--wb-line);
  background: transparent; color: var(--wb-muted-fg); font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
}

@media (max-width: 600px) { .mk-lbl { flex-basis: 100%; } .mk-bar { margin: 8px; } }

/* ==========================================================================
   Live settings page primitives (dashboard-settings.css, abridged)
   ========================================================================== */
.page { padding: 0 14px 24px; }
.stage {
  background: var(--wb-card); border-radius: var(--wb-radius); box-shadow: var(--wb-shadow);
  border: 1px solid color-mix(in srgb, var(--wb-line) 55%, transparent);
  display: flex; flex-direction: column; width: 100%; max-width: 1280px; margin-inline: auto; min-width: 0; overflow: hidden;
}
.shd-top { min-height: 42px; padding: 5px 16px; display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; border-bottom: 1px solid color-mix(in srgb, var(--wb-muted) 80%, transparent); }
.shd-title { display: flex; align-items: center; gap: 7px; min-width: 0; }
.shd-title > .i { width: 15px; height: 15px; color: var(--wb-primary); }
.shd-title h1 { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; }
.route-pill { font-family: var(--wb-mono); font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: var(--wb-wash); color: var(--wb-muted-fg); white-space: nowrap; }
[data-settings-view] .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 28px; padding: 0 11px; border-radius: 7px;
  border: 1px solid var(--wb-line); background: var(--wb-card); color: var(--wb-fg); font-size: 11.5px; font-weight: 700; cursor: pointer; white-space: nowrap; word-break: keep-all;
}
[data-settings-view] .btn:hover:not(:disabled) { background: var(--wb-muted); }
[data-settings-view] .btn.pri { background: var(--wb-primary); color: var(--wb-primary-fg); border-color: var(--wb-primary); }
[data-settings-view] .btn.pri:hover:not(:disabled) { filter: brightness(1.06); }
[data-settings-view] .btn:disabled { opacity: .48; cursor: not-allowed; }
.seg { display: inline-flex; align-items: center; gap: 2px; width: fit-content; max-width: 100%; height: 30px; padding: 2px; border-radius: 8px; background: var(--wb-muted); }
.seg button { display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 6px; height: 26px; padding: 0 10px; font-size: 11.5px; font-weight: 700; color: var(--wb-muted-fg); cursor: pointer; white-space: nowrap; font-family: var(--wb-mono); }
.seg button:hover { color: var(--wb-fg); }
.seg button[aria-pressed="true"] { background: var(--wb-card); color: var(--wb-fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12), inset 0 0 0 1px color-mix(in srgb, var(--wb-line) 70%, transparent); }

.sbody { display: grid; grid-template-columns: 172px minmax(0, 1fr); }
.snav { border-right: 1px solid var(--wb-muted); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; background: color-mix(in srgb, var(--wb-muted) 12%, var(--wb-card)); }
.snav-btn { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; border: 0; border-radius: 7px; padding: 6px 8px; background: transparent; color: var(--wb-muted-fg); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.snav-btn:hover { background: var(--wb-wash); color: var(--wb-fg); }
.snav-btn[aria-current="true"] { background: color-mix(in srgb, var(--wb-primary) 13%, var(--wb-card)); color: var(--wb-primary); font-weight: 700; }
.snav-btn .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--wb-primary); flex: none; }
.snav-btn .dot.none { background: transparent; }
.snav-btn .cnt { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--wb-muted-fg); padding: 0 5px; border-radius: 999px; background: var(--wb-wash); font-variant-numeric: tabular-nums; }
.snav-btn .cnt.warn { background: color-mix(in srgb, var(--wb-warn) 18%, var(--wb-card)); color: var(--wb-warn-ink); }
.scontent { min-width: 0; padding: 10px 18px 24px; display: flex; flex-direction: column; gap: 9px; }

.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 2px 2px 3px; }
.sec-head h2 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: -.01em; word-break: keep-all; }
.sec-head p { margin: 0; font-size: 11px; color: var(--wb-muted-fg); word-break: keep-all; }

[data-settings-view] .sgroup { border: 1px solid color-mix(in srgb, var(--wb-line) 75%, transparent); border-radius: 10px; background: var(--wb-card); overflow: hidden; }
[data-settings-view] .srow { display: grid; grid-template-columns: minmax(0, 1fr) 396px; gap: 0 18px; align-items: center; padding: 9px 16px; background: var(--wb-card); transition: background .1s; }
[data-settings-view] .srow + .srow { border-top: 1px solid color-mix(in srgb, var(--wb-muted) 82%, transparent); }
[data-settings-view] .srow:hover { background: color-mix(in srgb, var(--wb-fg) 2%, var(--wb-card)); }
[data-settings-view] .srow.overridden { box-shadow: inset 3px 0 0 var(--wb-primary); background: color-mix(in srgb, var(--wb-primary) 5%, var(--wb-card)); }
[data-settings-view] .srow.attn { box-shadow: inset 3px 0 0 var(--wb-warn); background: color-mix(in srgb, var(--wb-warn) 5%, var(--wb-card)); }
.kmeta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.klabel-line { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; min-width: 0; }
.klabel { font-size: 13px; font-weight: 700; word-break: keep-all; }
.skey { font-family: var(--wb-mono); font-size: 11px; font-weight: 500; color: var(--wb-muted-fg); background: color-mix(in srgb, var(--wb-muted) 55%, transparent); padding: 0 5px; border-radius: 4px; line-height: 17px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.tag { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; line-height: 16px; padding: 0 6px; border-radius: 999px; background: var(--wb-muted); color: var(--wb-muted-fg); white-space: nowrap; }
.tag.bucket { background: color-mix(in srgb, var(--wb-primary) 13%, var(--wb-card)); color: var(--wb-primary); }
.kdesc { margin: 0; font-size: 12px; color: var(--wb-muted-fg); line-height: 1.38; word-break: keep-all; }
.inline-warn { margin-top: 4px; padding: 4px 9px; border-radius: 6px; background: color-mix(in srgb, var(--wb-warn) 12%, var(--wb-card)); border: 1px solid color-mix(in srgb, var(--wb-warn) 36%, transparent); color: var(--wb-warn-ink); font-size: 11px; line-height: 1.35; word-break: keep-all; }
.inline-warn.fail { background: color-mix(in srgb, var(--wb-fail) 10%, var(--wb-card)); border-color: color-mix(in srgb, var(--wb-fail) 36%, transparent); color: var(--wb-fail); }
.hint { font-size: 11px; color: var(--wb-muted-fg); line-height: 1.35; word-break: keep-all; }
.hint:empty { display: none; }
.hint.err { color: var(--wb-fail); font-weight: 700; }
.hint.warn { color: var(--wb-warn-ink); font-weight: 700; }
.inp { width: 100%; height: 30px; padding: 0 9px; border: 1px solid var(--wb-line); border-radius: 7px; background: var(--wb-bg); color: var(--wb-fg); font-size: 12px; min-width: 0; }
.inp.mono { font-family: var(--wb-mono); }
.inp:focus-visible { outline: 1.5px solid var(--wb-primary); outline-offset: -1px; }
.inp.bad { border-color: color-mix(in srgb, var(--wb-fail) 60%, transparent); }
.inp.soft { border-color: color-mix(in srgb, var(--wb-warn) 60%, transparent); }
.inp:disabled { opacity: .62; cursor: not-allowed; }
.tg { position: relative; width: 36px; height: 20px; border-radius: 999px; border: 0; padding: 0; cursor: pointer; flex: none; background: color-mix(in srgb, var(--wb-fg) 22%, var(--wb-card)); transition: background .12s; }
.tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--wb-card); box-shadow: 0 1px 2px rgb(0 0 0 / .3); transition: left .12s; }
.tg[aria-checked="true"] { background: var(--wb-primary); }
.tg[aria-checked="true"]::after { left: 19px; }
.tg:disabled { opacity: .45; cursor: not-allowed; }
.tgl { font-size: 12px; font-weight: 600; word-break: keep-all; }
.origin-pill { min-width: 0; height: 26px; padding: 0 9px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--wb-line) 75%, transparent); background: var(--wb-wash); color: var(--wb-muted-fg); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
.origin-pill > .lbl { overflow: hidden; text-overflow: ellipsis; }
.origin-pill .i { width: 11px; height: 11px; }

/* Tier matrix (dashboard-settings.css .tier-*) – unchanged look, abridged */
.tier-group-head { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 10px; border-bottom: 1px solid color-mix(in srgb, var(--wb-muted) 90%, transparent); background: color-mix(in srgb, var(--wb-muted) 22%, var(--wb-card)); }
.tier-htabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 680px) { .tier-htabs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tier-htab { appearance: none; text-align: left; cursor: pointer; background: var(--wb-bg); border: 1px solid var(--wb-line); border-radius: 8px; padding: 8px 10px; color: var(--wb-fg); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tier-htab[aria-selected="true"] { background: color-mix(in srgb, var(--wb-primary) 11%, var(--wb-card)); border-color: var(--wb-primary); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--wb-primary) 28%, transparent); }
.tier-htab-id { font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.tier-htab-sub { font-family: var(--wb-mono); font-size: 10.5px; color: var(--wb-muted-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tier-scroll { overflow-x: auto; }
.tier-tbl { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 560px; }
.tier-tbl th { text-align: left; font-size: 11px; font-weight: 700; color: var(--wb-muted-fg); padding: 7px 8px; border-bottom: 1px solid color-mix(in srgb, var(--wb-muted) 85%, transparent); white-space: nowrap; }
.tier-tbl th:first-child, .tier-tbl td:first-child { padding-left: 16px; }
.tier-tbl td { padding: 7px 8px; border-bottom: 1px solid color-mix(in srgb, var(--wb-muted) 70%, transparent); }
.tier-tbl tr:last-child td { border-bottom: 0; }
.tier-tbl td.tname { font-family: var(--wb-mono); font-weight: 800; width: 80px; }
.tier-tbl .inp { height: 29px; }
.tier-tbl tr.pa-flash td { background: color-mix(in srgb, var(--wb-primary) 9%, var(--wb-card)); }
.tier-tbl tr.pa-flash td:first-child { box-shadow: inset 3px 0 0 var(--wb-primary); }

/* ==========================================================================
   Provider auth (new, pa-*): built only from the primitives above
   ========================================================================== */
.pa-rail { display: flex; align-items: center; justify-content: flex-end; gap: 8px; width: 396px; min-width: 0; }
.pa-rail .origin-pill { flex: 1 1 auto; }
.origin-pill.ok { background: color-mix(in srgb, var(--wb-ok) 12%, var(--wb-card)); border-color: color-mix(in srgb, var(--wb-ok) 38%, transparent); color: var(--wb-ok); }
.origin-pill.unset { background: color-mix(in srgb, var(--wb-warn) 12%, var(--wb-card)); border-color: color-mix(in srgb, var(--wb-warn) 36%, transparent); color: var(--wb-warn-ink); }
.origin-pill.fail { background: color-mix(in srgb, var(--wb-fail) 11%, var(--wb-card)); border-color: color-mix(in srgb, var(--wb-fail) 36%, transparent); color: var(--wb-fail); }
.origin-pill.busy { background: color-mix(in srgb, var(--wb-primary) 12%, var(--wb-card)); border-color: color-mix(in srgb, var(--wb-primary) 40%, transparent); color: var(--wb-primary); }
.pa-rail .origin-pill.here { flex: 0 1 auto; background: color-mix(in srgb, var(--wb-primary) 14%, var(--wb-card)); border-color: color-mix(in srgb, var(--wb-primary) 40%, transparent); color: var(--wb-primary); }
.origin-pill .tail { font-family: var(--wb-mono); font-weight: 600; opacity: .9; }
.pa-spin { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: pa-spin .8s linear infinite; flex: none; }
@keyframes pa-spin { to { transform: rotate(360deg); } }

.pa-link { align-self: flex-start; margin-top: 3px; display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: transparent; color: var(--wb-primary); font-size: 11px; font-weight: 700; cursor: pointer; }
.pa-link:hover { text-decoration: underline; }
.pa-link .i { width: 11px; height: 11px; }

/* 28x28 icon button (reset-icon-btn geometry) with radial hold-to-confirm fill */
.pa-ibtn { position: relative; overflow: hidden; flex: 0 0 28px; width: 28px; height: 28px; padding: 0; border-radius: 7px; border: 1px solid color-mix(in srgb, var(--wb-line) 85%, transparent); background: transparent; color: var(--wb-muted-fg); display: inline-grid; place-items: center; cursor: pointer; }
.pa-ibtn:hover { background: var(--wb-muted); color: var(--wb-fg); }
.pa-ibtn > .i { position: relative; z-index: 1; }
.pa-ibtn.danger:hover { color: var(--wb-fail); border-color: color-mix(in srgb, var(--wb-fail) 45%, transparent); }
.pa-ibtn.d-hold-btn::before { content: ""; position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: color-mix(in srgb, var(--wb-fail) 34%, transparent); transform: scale(0); pointer-events: none; }
.pa-ibtn.d-hold-btn.d-hold-active::before { animation: d-hold-radial var(--d-hold-dur, 1500ms) linear forwards; }
.pa-ibtn.d-hold-btn.d-hold-ready { color: var(--wb-card); border-color: var(--wb-fail); }
.pa-ibtn.d-hold-btn.d-hold-ready::before { background: var(--wb-fail); transform: scale(1); animation: none; }
@keyframes d-hold-radial { from { transform: scale(0); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  .pa-ibtn.d-hold-btn.d-hold-active::before { animation: none; transform: scale(1); opacity: .45; }
  .pa-spin { animation-duration: 2.4s; }
  [data-settings-view] .srow, .tg, .tg::after { transition: none; }
}

/* Full-width editor strip under a row (layer-drawer geometry) */
.pa-drawer { grid-column: 1 / -1; margin: 9px -16px -9px; padding: 9px 16px 10px; background: color-mix(in srgb, var(--wb-muted) 42%, var(--wb-bg)); border-top: 1px solid color-mix(in srgb, var(--wb-line) 60%, transparent); display: flex; flex-direction: column; gap: 6px; }
.pa-form { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.pa-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pa-field > label { font-size: 10.5px; font-weight: 800; color: var(--wb-muted-fg); }
.pa-field.key { flex: 1 1 300px; max-width: 460px; }
.pa-actions { display: flex; align-items: center; gap: 6px; padding-top: 17px; }
.pa-note { font-size: 11.5px; color: var(--wb-muted-fg); line-height: 1.45; word-break: keep-all; margin: 0; }
.pa-note b { color: var(--wb-fg); }

/* Sub-row (consent) under the OpenAI row */
[data-settings-view] .srow.pa-sub { padding-left: 34px; background: color-mix(in srgb, var(--wb-muted) 10%, var(--wb-card)); }
.pa-sub .klabel { font-size: 12.5px; }
.pa-sub .pa-rail { justify-content: flex-start; }

/* Consent request banner (scontent-level, repo-banner geometry) */
.pa-ask { padding: 9px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--wb-primary) 42%, transparent); background: color-mix(in srgb, var(--wb-primary) 8%, var(--wb-card)); box-shadow: inset 3px 0 0 var(--wb-primary); display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.pa-ask-text { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.pa-ask-title { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; color: var(--wb-fg); word-break: keep-all; }
.pa-ask-title .i { color: var(--wb-primary); }
.pa-ask-desc { margin: 0; font-size: 11.5px; line-height: 1.45; color: var(--wb-fg); word-break: keep-all; }
.pa-ask-desc code { font-size: 10.5px; padding: 1px 5px; border-radius: 4px; background: var(--wb-wash); }
.pa-ask-btns { display: flex; align-items: center; gap: 6px; flex: none; }

/* Local endpoints list */
.pa-eps { grid-column: 1 / -1; margin: 9px -16px -9px; border-top: 1px solid color-mix(in srgb, var(--wb-muted) 82%, transparent); }
.pa-ep { display: grid; grid-template-columns: 150px minmax(0, 1fr) 70px 150px 64px; gap: 10px; align-items: center; padding: 7px 16px; }
.pa-ep + .pa-ep { border-top: 1px solid color-mix(in srgb, var(--wb-muted) 70%, transparent); }
.pa-ep.head { font-size: 11px; font-weight: 700; color: var(--wb-muted-fg); padding-top: 6px; padding-bottom: 6px; }
.pa-ep .nm { display: flex; flex-direction: column; min-width: 0; }
.pa-ep .nm b { font-family: var(--wb-mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.pa-ep .nm span { font-family: var(--wb-mono); font-size: 10.5px; color: var(--wb-muted-fg); }
.pa-ep .url { font-family: var(--wb-mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pa-ep .kind { font-family: var(--wb-mono); font-size: 11px; font-weight: 700; }
.pa-ep .key { font-size: 11px; color: var(--wb-muted-fg); white-space: nowrap; }
.pa-ep .key.set { color: var(--wb-ok); font-weight: 700; }
.pa-ep .key .tail { font-family: var(--wb-mono); font-weight: 600; }
.pa-ep .acts { display: flex; gap: 6px; justify-content: flex-end; }
.pa-ep.editing { background: color-mix(in srgb, var(--wb-primary) 5%, var(--wb-card)); box-shadow: inset 3px 0 0 var(--wb-primary); }
.pa-ep-edit { padding: 9px 16px 11px; background: color-mix(in srgb, var(--wb-muted) 42%, var(--wb-bg)); border-top: 1px solid color-mix(in srgb, var(--wb-line) 60%, transparent); display: flex; flex-direction: column; gap: 8px; }
.pa-ep-grid { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto minmax(0, 220px); gap: 8px 10px; align-items: start; }
.pa-ep-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pa-ep-foot .sp { flex: 1 1 auto; }
.pa-ep-empty { padding: 12px 16px; font-size: 12px; color: var(--wb-muted-fg); }
.pa-ep-add { padding: 8px 16px 10px; border-top: 1px solid color-mix(in srgb, var(--wb-muted) 70%, transparent); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pa-json summary { cursor: pointer; font-size: 11px; font-weight: 700; color: var(--wb-muted-fg); }
.pa-json pre { margin: 6px 0 0; padding: 8px 10px; border-radius: 7px; background: var(--wb-bg); border: 1px solid var(--wb-line); font: 11px/1.5 var(--wb-mono); color: var(--wb-fg); overflow-x: auto; }

/* ==========================================================================
   Responsive collapse (matches dashboard-settings.css breakpoints)
   ========================================================================== */
@media (max-width: 1120px) {
  .sbody { grid-template-columns: 156px minmax(0, 1fr); }
  [data-settings-view] .srow { grid-template-columns: minmax(0, 1fr) 336px; gap: 0 12px; }

  [data-settings-view] .srow { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .pa-rail { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
  .pa-ep.head { display: none; }
  .pa-ep { grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; }

<script>
(function () {
  "use strict";
  var S = { or: "unset", oa: "out", cs: "none", ep: "list", theme: document.documentElement.getAttribute("data-theme") || "dark" };

  var IC = {
    key: '<svg class="i" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3M16 7l3 3M14 9l2 2"/></svg>',
    trash: '<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
    pen: '<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
    out: '<svg class="i" viewBox="0 0 24 24"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l-5-5 5-5M5 12h11"/></svg>',
    arrow: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    ext: '<svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    check: '<svg class="i" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>',
    alert: '<svg class="i" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
    ask: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg>'
  };

  var EMAIL = "minji.kim@example.com";

  function tierLink(provider, label) {
    return '<button type="button" class="pa-link" data-act="tier" data-provider="' + provider + '">' + label + IC.arrow + '</button>';
  }

  function holdBtn(act, title, icon) {
    return '<button type="button" class="pa-ibtn danger d-hold-btn" data-hold="' + act + '" title="' + title + ' (길게 눌러 확인)" aria-label="' + title + ' (길게 눌러 확인)">' + (icon || IC.trash) + '</button>';
  }

  /* ---------------- OpenRouter ---------------- */
  function openRouterRow() {
    var st = S.or, pill, ctl = "", drawer = "", extra = "", cls = "srow";
    var editing = st === "entry" || st === "prefix" || st === "rejected" || st === "down" || st === "replace";
    var hasKey = st === "set" || st === "replace";
    if (hasKey) {
      pill = '<span class="origin-pill ok" title="2026-11-22 저장">' + IC.check + '<span class="lbl">키 설정됨</span><span class="tail">…a1b2</span></span>';
      cls += " overridden";
      ctl = st === "set"
        ? '<button type="button" class="btn" data-act="or-replace">교체</button>' + holdBtn("or-remove", "OpenRouter 키 삭제")
        : '';
    } else {
      pill = '<span class="origin-pill unset"><span class="lbl">미설정</span></span>';
      ctl = editing ? '' : '<button type="button" class="btn" data-act="or-entry">' + IC.key + '키 추가</button>';
    }
    if (editing) {
      var val = "", inpCls = "inp mono", hint = '<span class="hint">sk-or-로 시작하는 키 · 저장 후에는 다시 표시되지 않습니다</span>';
      if (st === "prefix") { val = "or-live-3f9c21aa0e7d44b1"; inpCls += " soft"; hint = '<span class="hint warn">sk-or-로 시작하지 않습니다. OpenRouter 키가 맞는지 확인하세요. 그래도 저장할 수 있습니다.</span>'; }
      if (st === "rejected") { val = "sk-or-v1-3f9c 21aa0e7d44b1"; inpCls += " bad"; hint = '<span class="hint err">데몬이 키를 거부했습니다: 공백, 제어 문자 또는 ASCII가 아닌 문자가 있습니다.</span>'; }
      if (st === "down") { val = "sk-or-v1-3f9c21aa0e7d44b1c0a1b2"; }
      var downWarn = st === "down"
        ? '<div class="inline-warn fail">데몬이 응답하지 않아 키를 저장하지 못했습니다. 데몬이 다시 시작되는 중일 수 있습니다. 입력한 키는 이 입력란에만 남아 있습니다.</div>'
        : '';
      drawer =
        '<div class="pa-drawer">' +
          '<div class="pa-form">' +
            '<div class="pa-field key"><label for="or-key">' + (st === "replace" ? "새 OpenRouter API 키" : "OpenRouter API 키") + '</label>' +
              '<input id="or-key" class="' + inpCls + '" type="password" autocomplete="off" spellcheck="false" placeholder="sk-or-v1-…" data-val="' + val + '">' +
              hint +
            '</div>' +
            '<div class="pa-actions">' +
              '<button type="button" class="btn pri" data-act="or-save">' + (st === "down" ? "다시 시도" : "저장") + '</button>' +
              '<button type="button" class="btn" data-act="or-cancel">취소</button>' +
            '</div>' +
          '</div>' + downWarn +
        '</div>';
    }
    return '<div class="' + cls + '" data-row="openrouter">' +
      '<div class="kmeta">' +
        '<div class="klabel-line"><span class="klabel">OpenRouter</span><span class="tag">API 키</span><code class="skey">openrouter</code></div>' +
        '<p class="kdesc">Werk 하네스와 웹 도구가 OpenRouter 모델을 부를 때 쓰는 API 키입니다.</p>' +
        tierLink("openrouter", "Werk 티어에서 OpenRouter 모델 선택") + extra +
      '</div>' +
      '<div class="pa-rail">' + pill + ctl + '</div>' + drawer +
    '</div>';
  }

  /* ---------------- OpenAI (SIWC) ---------------- */
  function openAIRow() {
    var st = S.oa, pill, ctl = "", drawer = "", warn = "", cls = "srow";
    switch (st) {
      case "out":
        pill = '<span class="origin-pill unset"><span class="lbl">로그인 안 됨</span></span>';
        ctl = '<button type="button" class="btn pri" data-act="oa-signin">ChatGPT로 로그인' + IC.ext + '</button>';
        break;
      case "failed":
        pill = '<span class="origin-pill unset"><span class="lbl">로그인 안 됨</span></span>';
        ctl = '<button type="button" class="btn pri" data-act="oa-signin">다시 시도' + IC.ext + '</button>';
        warn = '<div class="inline-warn fail">로그인을 마치지 못했습니다: 브라우저에서 취소했거나 5분 안에 완료하지 않았습니다.</div>';
        break;
      case "pending":
        pill = '<span class="origin-pill busy"><span class="pa-spin" aria-hidden="true"></span><span class="lbl">브라우저에서 로그인 중…</span></span>';
        ctl = '<button type="button" class="btn" data-act="oa-cancel">취소</button>';
        drawer = '<div class="pa-drawer"><p class="pa-note">데몬이 실행 중인 컴퓨터의 기본 브라우저에서 OpenAI 로그인 페이지를 열었습니다. 그 브라우저에서 로그인과 <b>ChatGPT 요금제 사용 허용</b>을 마치면 이 행이 자동으로 바뀝니다. 5분이 지나면 자동으로 취소됩니다.</p></div>';
        break;
      case "in":
      case "noemail":
        cls += " overridden";
        pill = '<span class="origin-pill ok">' + IC.check + '<span class="lbl">' + (st === "in" ? EMAIL : "로그인됨") + '</span></span>';
        ctl = holdBtn("oa-signout", "OpenAI 로그아웃", IC.out);
        break;
      case "plan":
        cls += " attn";
        pill = '<span class="origin-pill unset"><span class="lbl">요금제 사용 꺼짐 · ' + EMAIL + '</span></span>';
        ctl = '<button type="button" class="btn pri" data-act="oa-signin">다시 로그인하여 허용' + IC.ext + '</button>' + holdBtn("oa-signout", "OpenAI 로그아웃", IC.out);
        warn = '<div class="inline-warn">로그인은 되었지만 ChatGPT 요금제 사용을 허용하지 않아 에이전트 세션에 쓸 수 없습니다.</div>';
        break;
      case "reauth":
        cls += " attn";
        pill = '<span class="origin-pill fail"><span class="lbl">다시 로그인 필요 · ' + EMAIL + '</span></span>';
        ctl = '<button type="button" class="btn pri" data-act="oa-signin">다시 로그인' + IC.ext + '</button>' + holdBtn("oa-signout", "OpenAI 로그아웃", IC.out);
        warn = '<div class="inline-warn fail">OpenAI가 토큰 갱신을 거부했습니다(만료 또는 철회). 다시 로그인할 때까지 이 계정을 쓰는 세션은 실패합니다.</div>';
        break;
    }
    return '<div class="' + cls + '" data-row="openai">' +
      '<div class="kmeta">' +
        '<div class="klabel-line"><span class="klabel">OpenAI</span><span class="tag">ChatGPT로 로그인</span><code class="skey">openai</code></div>' +
        '<p class="kdesc">ChatGPT 요금제로 내 에이전트 세션(Werk 하네스)을 실행합니다. 웹 검색·이미지 같은 도구는 이 계정을 쓰지 않습니다.</p>' +
        tierLink("openai", "Werk 티어에서 OpenAI 모델 선택") + warn +
      '</div>' +
      '<div class="pa-rail">' + pill + ctl + '</div>' + drawer +
    '</div>' + consentRow();
  }

  function consentRow() {
    var st = S.oa;
    if (st === "out" || st === "pending" || st === "failed") return "";
    var on = S.cs === "yes";
    var usable = st === "in" || st === "noemail";
    var state = S.cs === "yes" ? "허용됨" : S.cs === "no" ? "허용 안 함" : "아직 묻지 않음";
    var note = usable ? "" : '<span class="hint">다시 로그인해도 이 답은 유지됩니다.</span>';
    return '<div class="srow pa-sub" data-row="openai-consent">' +
      '<div class="kmeta">' +
        '<div class="klabel-line"><span class="klabel">백그라운드 세션에서 사용</span><span class="tag">' + state + '</span></div>' +
        '<p class="kdesc">워커, 예약 작업처럼 직접 조작하지 않는 세션도 이 계정의 ChatGPT 요금제를 쓸 수 있게 합니다. 끄면 그런 세션은 실행 전에 이유를 남기고 멈춥니다.</p>' +
      '</div>' +
      '<div class="pa-rail">' +
        '<button type="button" class="tg" role="switch" aria-checked="' + on + '" data-act="cs-toggle" aria-label="백그라운드 세션에서 사용"' + (usable ? "" : " disabled") + '></button>' +
        '<span class="tgl">' + (on ? "켜짐" : "꺼짐") + '</span>' + note +
      '</div>' +
    '</div>';
  }

  function consentBanner() {
    if (S.cs !== "ask") return "";
    return '<div class="pa-ask" role="region" aria-label="백그라운드 사용 동의 요청">' +
      '<div class="pa-ask-text">' +
        '<span class="pa-ask-title">' + IC.ask + '백그라운드 세션이 OpenAI 계정을 쓰려고 합니다</span>' +
        '<p class="pa-ask-desc">워커 <code>wrk-7c1e</code>(티어 <code>medium</code>, <code>openai gpt-5.1-codex</code>)가 ' + EMAIL + '의 ChatGPT 요금제로 실행하려다 멈췄습니다. 허용하면 앞으로 워커와 예약 작업도 이 계정을 씁니다. 아래 설정에서 언제든 끌 수 있습니다.</p>' +
      '</div>' +
      '<div class="pa-ask-btns">' +
        '<button type="button" class="btn pri" data-act="cs-yes">허용</button>' +
        '<button type="button" class="btn" data-act="cs-no">허용 안 함</button>' +
      '</div>' +
    '</div>';
  }

  /* ---------------- Local endpoints ---------------- */
  var EPS = [
    { name: "ollama-box", url: "http://localhost:11434/v1", kind: "ollama", key: "" },
    { name: "lab-vllm", url: "https://vllm.lab.internal:8000/v1", kind: "vllm", key: "…9f3c" }
  ];

  function epRow(ep, editing) {
    var key = ep.key
      ? '<span class="key set">키 설정됨 <span class="tail">' + ep.key + '</span></span>'
      : '<span class="key">키 없음</span>';
    return '<div class="pa-ep' + (editing ? " editing" : "") + '">' +
      '<div class="nm"><b>' + ep.name + '</b><span>local/' + ep.name + '</span></div>' +
      '<div class="url" title="' + ep.url + '">' + ep.url + '</div>' +
      '<div class="kind">' + ep.kind + '</div>' + key +
      '<div class="acts"><button type="button" class="pa-ibtn" data-act="ep-edit" title="편집" aria-label="' + ep.name + ' 편집">' + IC.pen + '</button>' +
        holdBtn("ep-remove", ep.name + " 삭제") + '</div>' +
    '</div>';
  }

  function epEditor(mode) {
    var isNew = mode === "add" || mode === "invalid";
    var name = "", url = "", kind = "ollama", nameCls = "inp mono", urlCls = "inp mono";
    var nameHint = '<span class="hint">소문자·숫자·하이픈, 첫 글자는 문자나 숫자, 최대 64자</span>';
    var urlHint = '<span class="hint">http(s) 절대 주소 · 사용자 정보, 쿼리, # 없이 · 끝의 / 는 지워집니다</span>';
    var keyLabel = "API 키 (선택)", keyPh = "없으면 비워 두세요", keyHint = '<span class="hint">이 주소로만 보냅니다</span>';
    var urlWarn = "";
    if (mode === "invalid") {
      name = "My_Box"; nameCls += " bad"; nameHint = '<span class="hint err">소문자, 숫자, 하이픈만 쓸 수 있습니다.</span>';
      url = "localhost:11434/v1?stream=1"; urlCls += " bad"; urlHint = '<span class="hint err">http:// 또는 https://로 시작하고 쿼리(?)가 없어야 합니다.</span>';
    }
    if (mode === "edit") {
      name = "lab-vllm"; url = "https://vllm2.lab.internal:8000/v1"; kind = "vllm"; urlCls += " soft";
      keyLabel = "API 키"; keyPh = "새 주소용 키 입력"; keyHint = '<span class="hint">비워 두면 키 없이 연결합니다</span>';
      urlWarn = '<div class="inline-warn">주소가 바뀌었습니다. 기존 키(…9f3c)는 이전 주소에만 묶여 있어 새 주소로 보내지 않습니다. 새 주소에 키가 필요하면 다시 입력하세요.</div>';
    }
    var seg = '<div class="seg" role="group" aria-label="종류">' +
      '<button type="button" data-act="ep-kind" data-v="vllm" aria-pressed="' + (kind === "vllm") + '">vllm</button>' +
      '<button type="button" data-act="ep-kind" data-v="ollama" aria-pressed="' + (kind === "ollama") + '">ollama</button></div>';
    return '<div class="pa-ep-edit">' +
      '<div class="pa-ep-grid">' +
        '<div class="pa-field"><label for="ep-name">이름</label><input id="ep-name" class="' + nameCls + '" value="' + name + '" placeholder="ollama-box" spellcheck="false">' + nameHint + '</div>' +
        '<div class="pa-field"><label for="ep-url">기본 URL</label><input id="ep-url" class="' + urlCls + '" value="' + url + '" placeholder="http://localhost:11434/v1" spellcheck="false">' + urlHint + '</div>' +
        '<div class="pa-field"><label>종류</label>' + seg + '</div>' +
        '<div class="pa-field"><label for="ep-key">' + keyLabel + '</label><input id="ep-key" class="inp mono" type="password" autocomplete="off" placeholder="' + keyPh + '">' + keyHint + '</div>' +
      '</div>' + urlWarn +
      '<div class="pa-ep-foot"><span class="sp"></span>' +
        '<button type="button" class="btn pri" data-act="ep-save"' + (mode === "invalid" ? " disabled" : "") + '>' + (isNew ? "추가" : "저장") + '</button>' +
        '<button type="button" class="btn" data-act="ep-cancel">취소</button>' +
      '</div>' +
    '</div>';
  }

  function endpointsRow() {
    var st = S.ep, list = "";
    if (st === "empty") {
      list = '<div class="pa-ep-empty">등록된 로컬 엔드포인트가 없습니다.</div>';
    } else {
      list = '<div class="pa-ep head"><span>이름</span><span>기본 URL</span><span>종류</span><span>API 키</span><span></span></div>';
      list += epRow(EPS[0], false);
      list += epRow(EPS[1], st === "edit");
      if (st === "edit") list += epEditor("edit");
    }
    if (st === "add" || st === "invalid") list += epEditor(st);
    var json = {};
    (st === "empty" ? [] : EPS).forEach(function (e) { json[e.name] = { base_url: e.url, kind: e.kind }; });
    var count = st === "empty" ? 0 : 2;
    var add = (st === "add" || st === "invalid" || st === "edit") ? "" :
      '<button type="button" class="btn" data-act="ep-add">+ 엔드포인트</button>';
    return '<div class="srow" data-row="werk-endpoints">' +
      '<div class="kmeta">' +
        '<div class="klabel-line"><span class="klabel">Werk 로컬 엔드포인트</span><code class="skey">agent.werk_endpoints</code><span class="tag">' + count + '개</span></div>' +
        '<p class="kdesc">직접 운영하는 vLLM·Ollama 서버입니다. 각 엔드포인트는 프로바이더 <code>local/&lt;이름&gt;</code>으로 티어에서 고를 수 있습니다.</p>' +
        tierLink("local", "Werk 티어에서 로컬 모델 선택") +
      '</div>' +
      '<div class="pa-rail"><span class="origin-pill here"><span class="lbl">전역</span></span></div>' +
      '<div class="pa-eps">' + list +
        '<div class="pa-ep-add">' + add +
          '<details class="pa-json"><summary>저장 형식(JSON) 보기</summary><pre>' + JSON.stringify(json, null, 2).replace(/</g, "&lt;") + '</pre></details>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /* ---------------- Tier matrix (existing picker, abridged) ---------------- */
  var TIERS = [
    { t: "small", backend: "werk", model: "local/ollama-box qwen3:32b", effort: "—", p: "local" },
    { t: "medium", backend: "werk", model: "openai gpt-5.1-codex", effort: "medium", p: "openai" },
    { t: "large", backend: "werk", model: "openrouter anthropic/claude-opus-4.5", effort: "high", p: "openrouter" },
    { t: "xlarge", backend: "werk", model: "openai gpt-5.1-codex-max", effort: "xhigh", p: "openai" }
  ];
  function tierBlock() {
    var rows = TIERS.map(function (r) {
      return '<tr data-prov="' + r.p + '"><td class="tname">' + r.t + '</td>' +
        '<td><input class="inp mono" value="' + r.backend + '" aria-label="' + r.t + ' 백엔드"></td>' +
        '<td><input class="inp mono" value="' + r.model + '" aria-label="' + r.t + ' 모델"></td>' +
        '<td><input class="inp mono" value="' + r.effort + '" aria-label="' + r.t + ' 추론 강도"></td></tr>';
    }).join("");
    return '<div class="sgroup" id="tier-matrix">' +
      '<div class="tier-group-head">' +
        '<div class="klabel-line"><span class="klabel">능력 티어 매트릭스</span><code class="skey">agents.tier</code><span class="tag">기존 화면 · 변경 없음</span></div>' +
        '<div class="tier-htabs" role="tablist">' +
          '<button class="tier-htab" role="tab" aria-selected="false"><span class="tier-htab-id">Claude</span><span class="tier-htab-sub">sonnet · opus</span></button>' +
          '<button class="tier-htab" role="tab" aria-selected="false"><span class="tier-htab-id">Codex</span><span class="tier-htab-sub">gpt-5.1-codex</span></button>' +
          '<button class="tier-htab" role="tab" aria-selected="false"><span class="tier-htab-id">AgY</span><span class="tier-htab-sub">gemini-3-pro</span></button>' +
          '<button class="tier-htab" role="tab" aria-selected="true"><span class="tier-htab-id">Werk</span><span class="tier-htab-sub">openrouter · openai · local</span></button>' +
        '</div>' +
      '</div>' +
      '<div class="tier-scroll"><table class="tier-tbl"><thead><tr><th>티어</th><th>백엔드</th><th>모델</th><th>추론 강도</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '</div>';
  }

  function contextRows() {
    return '<div class="sgroup">' +
      '<div class="srow"><div class="kmeta"><div class="klabel-line"><span class="klabel">자식 대기 일수</span><code class="skey">agent.child_waiting_days</code></div><p class="kdesc">(기존 행 · 문맥용)</p></div><div class="pa-rail"><span class="origin-pill"><span class="lbl">내장 기본값</span></span></div></div>' +
    '</div>';
  }

  /* ---------------- Render ---------------- */
  function render() {
    document.documentElement.setAttribute("data-theme", S.theme);
    var attention = (S.or === "unset" ? 1 : 0) + ((S.oa === "out" || S.oa === "failed") ? 0 : (S.oa === "reauth" || S.oa === "plan") ? 1 : 0) + (S.cs === "ask" ? 1 : 0);
    var cnt = document.getElementById("nav-cnt");
    cnt.textContent = attention ? String(attention) : "";
    cnt.className = "cnt" + (attention ? " warn" : "");
    var html =
      '<div class="sec-head"><h2>에이전트 · 티어</h2><p>프로바이더 자격 증명은 이 컴퓨터의 데몬에만 저장됩니다.</p></div>' +
      consentBanner() +
      '<div class="sec-head"><h2>프로바이더 자격 증명</h2></div>' +
      '<div class="sgroup" id="providers">' + openRouterRow() + openAIRow() + '</div>' +
      '<div class="sgroup">' + endpointsRow() + '</div>' +
      tierBlock() + contextRows();
    document.getElementById("scontent").innerHTML = html;
    // Demo-only: fill error-state values after render so the attribute never holds a stored key.
    var k = document.getElementById("or-key");
    if (k && k.dataset.val) { k.value = k.dataset.val; k.removeAttribute("data-val"); }
    document.querySelectorAll("#mk-bar .mk-grp").forEach(function (g) {
      var cur = S[g.dataset.mk];
      g.querySelectorAll(".mk-btn").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.v === cur)); });
    });
  }

  document.getElementById("mk-bar").addEventListener("click", function (e) {
    var b = e.target.closest(".mk-btn"); if (!b) return;
    var g = b.closest(".mk-grp").dataset.mk;
    S[g] = b.dataset.v;
    if (g === "cs" && (S.oa !== "in" && S.oa !== "noemail") && b.dataset.v !== "none") S.oa = "in";
    if (g === "oa" && S.cs === "ask" && S.oa !== "in" && S.oa !== "noemail") S.cs = "none";
    render();
  });

  var ACT = {
    "or-entry": function () { S.or = "entry"; },
    "or-replace": function () { S.or = "replace"; },
    "or-cancel": function () { S.or = S.or === "replace" ? "set" : "unset"; },
    "or-save": function () {
      var v = (document.getElementById("or-key") || {}).value || "";
      if (!v) return false;
      S.or = "set";
    },
    "oa-signin": function () { S.oa = "pending"; },
    "oa-cancel": function () { S.oa = "out"; },
    "cs-yes": function () { S.cs = "yes"; },
    "cs-no": function () { S.cs = "no"; },
    "cs-toggle": function () { S.cs = S.cs === "yes" ? "no" : "yes"; },
    "ep-add": function () { S.ep = "add"; },
    "ep-edit": function () { S.ep = "edit"; },
    "ep-cancel": function () { S.ep = "list"; },
    "ep-save": function () { S.ep = "list"; },
    "ep-kind": function (b) { b.parentNode.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); return false; },
    "tier": function (b) {
      var p = b.dataset.provider, box = document.getElementById("tier-matrix");
      box.scrollIntoView({ behavior: "smooth", block: "start" });
      box.querySelectorAll("tr[data-prov]").forEach(function (tr) { tr.classList.toggle("pa-flash", tr.dataset.prov === p); });
      return false;
    }
  };
  document.getElementById("scontent").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    var fn = ACT[b.dataset.act]; if (!fn) return;
    if (fn(b) !== false) render();
  });
  document.getElementById("scontent").addEventListener("input", function (e) {
    if (e.target.id !== "or-key") return;
    var v = e.target.value.trim(), hint = e.target.parentNode.querySelector(".hint");
    var soft = v !== "" && v.indexOf("sk-or-") !== 0;
    e.target.classList.toggle("soft", soft); e.target.classList.remove("bad");
    hint.className = "hint" + (soft ? " warn" : "");
    hint.textContent = soft ? "sk-or-로 시작하지 않습니다. OpenRouter 키가 맞는지 확인하세요. 그래도 저장할 수 있습니다." : "sk-or-로 시작하는 키 · 저장 후에는 다시 표시되지 않습니다";
  });

  /* ---------------- Hold-to-confirm (WsHoldConfirm behavior, 1.5s) ---------------- */
  var HOLD_MS = 1500, hold = null;
  var DONE = {
    "or-remove": function () { S.or = "unset"; },
    "oa-signout": function () { S.oa = "out"; if (S.cs === "ask") S.cs = "none"; },
    "ep-remove": function () { S.ep = "list"; }
  };
  function cancelHold() {
    if (!hold) return;
    clearTimeout(hold.timer); hold.el.classList.remove("d-hold-active", "d-hold-ready"); hold = null;
  }
  function startHold(el) {
    cancelHold();
    el.style.setProperty("--d-hold-dur", HOLD_MS + "ms");
    el.classList.add("d-hold-active");
    hold = { el: el, timer: setTimeout(function () {
      el.classList.add("d-hold-ready");
      hold.timer = setTimeout(function () { var a = el.dataset.hold; hold = null; if (DONE[a]) { DONE[a](); render(); } }, 160);
    }, HOLD_MS) };
  }
  var sc = document.getElementById("scontent");
  sc.addEventListener("pointerdown", function (e) { var b = e.target.closest("[data-hold]"); if (b) { e.preventDefault(); startHold(b); } });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) {
    sc.addEventListener(t, function (e) { if (hold && (t !== "pointerleave" || e.target === hold.el)) { if (!hold.el.classList.contains("d-hold-ready")) cancelHold(); } }, true);
  });
  sc.addEventListener("keydown", function (e) {
    var b = e.target.closest && e.target.closest("[data-hold]");
    if (e.key === "Escape") { cancelHold(); return; }
    if (b && (e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); startHold(b); }
  });
  sc.addEventListener("keyup", function (e) { if ((e.key === " " || e.key === "Enter") && hold && !hold.el.classList.contains("d-hold-ready")) cancelHold(); });
  window.addEventListener("blur", cancelHold);
  document.addEventListener("visibilitychange", cancelHold);

  render();
})();
</script>
</body>
</html>
