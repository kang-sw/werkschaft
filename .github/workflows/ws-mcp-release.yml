name: ws-mcp release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/ws-mcp-release.yml"
      - ".github/workflows/werkschaft-tauri-build.yml"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "agents-plugin/**"
      - "agents-plugin-wsflow/**"
      - "agents-plugin-tool/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to embed in ws-mcp binaries, for example 0.53.2-dev"
        required: false
        default: "0.53.2-dev"
      tauri_dry_run:
        description: "Build signed Tauri desktop artifacts without publishing; supply a stable or canary version"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  # The tag CI gate reads ws-mcp CI runs for the tagged commit.
  actions: read

# One run per ref at a time. A tag push can start two runs for the same tag;
# run concurrently they race `gh release upload` (HTTP 422 "asset already
# exists"). Queued, not cancelled: the later run re-uploads with --clobber, so
# the release never ends up half-published by a cancelled run.
concurrency:
  group: ws-mcp-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ws-mcp assets
    runs-on: ubuntu-latest
    outputs:
      tauri_version: ${{ steps.route.outputs.tauri_version }}
    # Normal duration ~2 min. Without a cap, a hung step burns runner time while
    # the run still reads as in-progress.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agents-plugin-tool
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agents-plugin-tool/go.mod
          cache-dependency-path: agents-plugin-tool/go.sum

      - name: Select the Tauri build version
        id: route
        env:
          TAURI_DRY_RUN: ${{ inputs.tauri_dry_run }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          number='(0|[1-9][0-9]*)'
          core="$number\.$number\.$number"
          canary="$core-canary\.$number"
          if [[ "$TAURI_DRY_RUN" == true ]]; then
            version=${DISPATCH_VERSION#v}
            if [[ ! "$version" =~ ^($core|$canary)$ ]]; then
              echo '::error::Set version to the checkout plugin version or that version followed by -canary.N.'
              exit 1
            fi
            echo "tauri_version=$version" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" =~ ^v($core|$canary)$ ]]; then
            echo "tauri_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # The release does not re-run `go test`: ws-mcp CI already ran the selected
      # ubuntu + windows groups on this exact commit (the ship flow waits for it
      # before tagging). A tag whose
      # commit has no green ws-mcp CI run publishes nothing. A branch push
      # starts no ws-mcp CI run, so the ship flow dispatches one on the
      # release branch head it tags. Every job must succeed, except the two
      # opt-in long legs may be skipped. Ship enforces success for those too
      # when the owner requests long tests.
      - name: Require green ws-mcp CI on the tagged commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=0
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ws-mcp-ci.yml/runs?head_sha=${GITHUB_SHA}&status=success" --jq '.workflow_runs[].id'); do
            ran=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" --jq '.jobs | length > 0 and all(.conclusion == "success" or (.conclusion == "skipped" and (.name == "go test (ubuntu-latest, long)" or .name == "go test (windows-latest, long)")))')
            if [ "$ran" = "true" ]; then green=1; break; fi
          done
          if [ "$green" -lt 1 ]; then
            echo "::error::No successful ws-mcp CI run for ${GITHUB_SHA}; run ws-mcp CI on this commit (gh workflow run ws-mcp-ci.yml --ref release/<version>) before tagging."
            exit 1
          fi

      - name: Validate plugin release contract
        run: |
          plugin_version=$(jq -r '.plugin_version' ../agents-plugin/runtime.json)
          release_tag=$(jq -r '.release_tag' ../agents-plugin/runtime.json)
          test "$release_tag" = "v$plugin_version"
          jq . ../agents-plugin/.codex-plugin/plugin.json >/dev/null
          jq . ../agents-plugin/.mcp.json >/dev/null
          jq . ../agents-plugin/runtime.json >/dev/null
          jq . ../.agents/plugins/marketplace.json >/dev/null
          jq . ../.claude-plugin/marketplace.json >/dev/null
          test "$(jq -r '.plugins[].name' ../.agents/plugins/marketplace.json | sort | tr '\n' ' ')" = "ws wsflow "
          test "$(jq -r '.plugins[].name' ../.claude-plugin/marketplace.json | sort | tr '\n' ' ')" = "ws wsflow "

      - name: Generate embedded workflow packages
        run: python3 scripts/generate-package-assets.py

      - name: Build release assets
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scripts/build-release-assets.sh "$DISPATCH_VERSION"
          elif [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            scripts/build-release-assets.sh "${GITHUB_REF_NAME}"
          else
            scripts/build-release-assets.sh 0.53.2-dev
          fi

      - name: Verify release asset checksums
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ws-mcp-assets
          path: agents-plugin-tool/dist/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        # The Tauri publisher handles exact stable tags and includes the native assets.
        if: startsWith(github.ref, 'refs/tags/') && !inputs.tauri_dry_run && (steps.route.outputs.tauri_version == '' || contains(steps.route.outputs.tauri_version, '-canary.'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Automated ws-mcp release assets for ${GITHUB_REF_NAME}."
          release_flags=()
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-canary\.[0-9]+$ ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "$notes" "${release_flags[@]}"
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  windows-smoke:
    name: Windows ws-mcp smoke
    runs-on: windows-latest
    # Builds and smoke-runs the native Windows executable only; the Windows
    # `go test` suite runs in ws-mcp CI (see the build job's CI gate). Normal
    # duration a few minutes; the cap turns a hang into a fast, legible failure.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents-plugin-tool
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agents-plugin-tool/go.mod
          cache-dependency-path: agents-plugin-tool/go.sum

      - name: Build Windows executable
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and -not [string]::IsNullOrWhiteSpace($env:DISPATCH_VERSION)) {
            $buildVersion = $env:DISPATCH_VERSION.Trim() -replace '^v', ''
          } elseif ($env:GITHUB_REF -like "refs/tags/*") {
            $buildVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $buildVersion = "0.53.2-dev"
          }
          if ($buildVersion -notmatch '^[0-9A-Za-z._+-]+$') {
            throw "Invalid build version: $buildVersion"
          }
          $sourceCommit = (git rev-parse --short=12 HEAD 2>$null)
          if (-not $sourceCommit) { $sourceCommit = "unknown" }
          New-Item -ItemType Directory -Force dist | Out-Null
          python scripts/generate-package-assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags "-s -w -X main.version=$buildVersion -X main.sourceCommit=$sourceCommit" -o dist/ws-mcp-windows-amd64.exe ./cmd/ws-mcp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/write-runtime-metadata.py dist/ws-mcp-windows-amd64.exe --version "$buildVersion" --source-commit "$sourceCommit"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows executable smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path ".\dist\ws-mcp-windows-amd64.exe"
          $root = Resolve-Path ".."
          & $exe smoke --root $root

  tauri-desktop:
    name: Tauri desktop
    needs: build
    if: needs.build.outputs.tauri_version != ''
    uses: ./.github/workflows/werkschaft-tauri-build.yml
    with:
      version: ${{ needs.build.outputs.tauri_version }}
      dry_run: ${{ inputs.tauri_dry_run || false }}
      updater_public_key: ${{ (inputs.tauri_dry_run && vars.WERKSCHAFT_EVAL_UPDATER_PUBLIC_KEY) || (!inputs.tauri_dry_run && vars.WERKSCHAFT_UPDATER_PUBLIC_KEY) || '' }}
    secrets:
      signing_key: ${{ (inputs.tauri_dry_run && secrets.WERKSCHAFT_EVAL_UPDATER_PRIVATE_KEY) || (!inputs.tauri_dry_run && secrets.TAURI_SIGNING_PRIVATE_KEY) || '' }}
      signing_password: ${{ (inputs.tauri_dry_run && secrets.WERKSCHAFT_EVAL_UPDATER_KEY_PASSWORD) || (!inputs.tauri_dry_run && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD) || '' }}
