name: ws canary

# One-click develop-direct canary workflow (without merging to main, cutting an
# ephemeral release branch, or pushing tags manually).
#
# - artifact mode: builds ws-mcp-assets (all 6 targets) + werkschaft-tauri-assets
#   (macOS arm64 + Windows x64) as GitHub Actions workflow artifacts using the
#   checkout's runtime core (<core>-canary.0). Defaults to evaluation signing
#   (WERKSCHAFT_EVALUATION=1) and skips ws-mcp-ci.yml unless run_ci=true.
#   Production signing in artifact mode is allowed only on refs/heads/develop.
# - prerelease mode: requires refs/heads/develop, emits a non-blocking
#   ::warning:: if develop is ahead of the review-watermark frontier, runs
#   ws-mcp-ci.yml via workflow_call, derives the next patch core X.Y.(Z+1) and
#   next monotonic vX.Y.(Z+1)-canary.N (N >= 1), applies bump-ws-version.sh
#   ephemerally in build/windows-smoke/package checkouts, and publishes an
#   atomic draft-then-undraft GitHub prerelease targeting GITHUB_SHA with
#   production signing.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "artifact: build workflow artifacts only; prerelease: run CI and publish vX.Y.(Z+1)-canary.N from develop"
        type: choice
        required: true
        default: "artifact"
        options:
          - "artifact"
          - "prerelease"
      run_ci:
        description: "Run ws-mcp CI in artifact mode (prerelease mode always runs CI)"
        type: boolean
        required: false
        default: false
      long_tests:
        description: "Also run the long test group when ws-mcp CI runs"
        type: boolean
        required: false
        default: false
      signing:
        description: "artifact mode signing: eval (loopback feed) or production (develop only); prerelease always uses production"
        type: choice
        required: false
        default: "eval"
        options:
          - "eval"
          - "production"

permissions: {}

concurrency:
  group: ws-canary-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan canary build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      bump_core: ${{ steps.resolve.outputs.bump_core }}
      eval_signing: ${{ steps.resolve.outputs.eval_signing }}
      run_ci: ${{ steps.resolve.outputs.run_ci }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: ${{ inputs.mode != 'prerelease' && 1 || 0 }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check review-watermark advisory
        if: inputs.mode == 'prerelease'
        run: python3 agents-plugin-tool/scripts/resolve-canary-version.py watermark --target HEAD

      - name: Resolve canary build plan
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_MODE: ${{ inputs.mode }}
          CANARY_SIGNING: ${{ inputs.signing }}
          CANARY_REF: ${{ github.ref }}
          CANARY_REPO: ${{ github.repository }}
          RUN_CI_INPUT: ${{ inputs.run_ci }}
        run: |
          python3 agents-plugin-tool/scripts/resolve-canary-version.py resolve \
            --mode "$CANARY_MODE" \
            --ref "$CANARY_REF" \
            --signing "$CANARY_SIGNING" \
            --github-repository "$CANARY_REPO" \
            --github-output "$GITHUB_OUTPUT"
          if [ "$CANARY_MODE" = "prerelease" ] || [ "$RUN_CI_INPUT" = "true" ]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_ci=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: ws-mcp CI
    needs: plan
    if: needs.plan.outputs.run_ci == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ws-mcp-ci.yml
    with:
      long_tests: ${{ inputs.long_tests || false }}

  build:
    name: Build ws-mcp assets
    needs: [plan, ci]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agents-plugin-tool
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agents-plugin-tool/go.mod
          cache-dependency-path: agents-plugin-tool/go.sum

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply ephemeral canary core version
        if: needs.plan.outputs.bump_core != ''
        working-directory: ${{ github.workspace }}
        env:
          BUMP_CORE: ${{ needs.plan.outputs.bump_core }}
        run: sh agents-plugin-tool/scripts/bump-ws-version.sh "$BUMP_CORE"

      - name: Validate plugin release contract
        run: |
          plugin_version=$(jq -r '.plugin_version' ../agents-plugin/runtime.json)
          release_tag=$(jq -r '.release_tag' ../agents-plugin/runtime.json)
          test "$release_tag" = "v$plugin_version"
          wsflow_version=$(jq -r '.plugin_version' ../agents-plugin-wsflow/runtime.json)
          wsflow_tag=$(jq -r '.release_tag' ../agents-plugin-wsflow/runtime.json)
          test "$wsflow_version" = "$plugin_version"
          test "$wsflow_tag" = "$release_tag"
          jq . ../agents-plugin/.codex-plugin/plugin.json >/dev/null
          jq . ../agents-plugin/.mcp.json >/dev/null
          jq . ../agents-plugin/runtime.json >/dev/null
          jq . ../.agents/plugins/marketplace.json >/dev/null
          jq . ../.claude-plugin/marketplace.json >/dev/null
          test "$(jq -r '.plugins[].name' ../.agents/plugins/marketplace.json | sort | tr '\n' ' ')" = "ws wsflow "
          test "$(jq -r '.plugins[].name' ../.claude-plugin/marketplace.json | sort | tr '\n' ' ')" = "ws wsflow "

      - name: Generate embedded workflow packages
        run: python3 scripts/generate-package-assets.py

      - name: Build release assets
        env:
          BUILD_VERSION: ${{ needs.plan.outputs.version }}
        run: scripts/build-release-assets.sh "$BUILD_VERSION"

      - name: Verify release asset checksums
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ws-mcp-assets
          path: agents-plugin-tool/dist/*
          if-no-files-found: error

  windows-smoke:
    name: Windows ws-mcp smoke
    needs: [plan, ci]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agents-plugin-tool
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agents-plugin-tool/go.mod
          cache-dependency-path: agents-plugin-tool/go.sum

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply ephemeral canary core version
        if: needs.plan.outputs.bump_core != ''
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          BUMP_CORE: ${{ needs.plan.outputs.bump_core }}
        run: sh agents-plugin-tool/scripts/bump-ws-version.sh "$BUMP_CORE"

      - name: Build Windows executable
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:BUILD_VERSION -notmatch '^[0-9A-Za-z._+-]+$') {
            throw "Invalid build version: $($env:BUILD_VERSION)"
          }
          $sourceCommit = (git rev-parse --short=12 HEAD 2>$null)
          if (-not $sourceCommit) { $sourceCommit = "unknown" }
          New-Item -ItemType Directory -Force dist | Out-Null
          python scripts/generate-package-assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags "-s -w -X main.version=$($env:BUILD_VERSION) -X main.sourceCommit=$sourceCommit" -o dist/ws-mcp-windows-amd64.exe ./cmd/ws-mcp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/write-runtime-metadata.py dist/ws-mcp-windows-amd64.exe --version "$($env:BUILD_VERSION)" --source-commit "$sourceCommit"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows executable smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path ".\dist\ws-mcp-windows-amd64.exe"
          $root = Resolve-Path ".."
          & $exe smoke --root $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  tauri-desktop:
    name: Tauri desktop
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result == 'success' }}
    # Required by werkschaft-tauri-build.yml's publish job declaration (skipped on branch refs).
    permissions:
      contents: write
    uses: ./.github/workflows/werkschaft-tauri-build.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      dry_run: ${{ needs.plan.outputs.eval_signing == 'true' }}
      bump_core: ${{ needs.plan.outputs.bump_core }}
      updater_public_key: ${{ (needs.plan.outputs.eval_signing == 'true' && vars.WERKSCHAFT_EVAL_UPDATER_PUBLIC_KEY) || (needs.plan.outputs.eval_signing == 'false' && github.ref == 'refs/heads/develop' && vars.WERKSCHAFT_UPDATER_PUBLIC_KEY) || '' }}
    secrets:
      signing_key: ${{ (needs.plan.outputs.eval_signing == 'true' && secrets.WERKSCHAFT_EVAL_UPDATER_PRIVATE_KEY) || (needs.plan.outputs.eval_signing == 'false' && github.ref == 'refs/heads/develop' && secrets.TAURI_SIGNING_PRIVATE_KEY) || '' }}
      signing_password: ${{ (needs.plan.outputs.eval_signing == 'true' && secrets.WERKSCHAFT_EVAL_UPDATER_KEY_PASSWORD) || (needs.plan.outputs.eval_signing == 'false' && github.ref == 'refs/heads/develop' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD) || '' }}

  publish:
    name: Publish canary prerelease
    needs: [plan, ci, build, windows-smoke, tauri-desktop]
    if: ${{ !cancelled() && inputs.mode == 'prerelease' && github.ref == 'refs/heads/develop' && needs.plan.result == 'success' && needs.ci.result == 'success' && needs.build.result == 'success' && needs.windows-smoke.result == 'success' && needs.tauri-desktop.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Download native ws-mcp assets
        uses: actions/download-artifact@v5
        with:
          name: ws-mcp-assets
          path: ${{ runner.temp }}/ws-mcp-assets

      - name: Download Tauri release assets
        uses: actions/download-artifact@v5
        with:
          name: werkschaft-tauri-assets
          path: ${{ runner.temp }}/tauri-release

      - name: Verify native checksums and Tauri release feed
        env:
          CANARY_VERSION: ${{ needs.plan.outputs.version }}
          WERKSCHAFT_UPDATER_PUBLIC_KEY: ${{ vars.WERKSCHAFT_UPDATER_PUBLIC_KEY }}
        run: |
          (cd "$RUNNER_TEMP/ws-mcp-assets" && shasum -a 256 -c SHA256SUMS)
          node agents-plugin-tool/desktop/scripts/release.cjs --verify \
            --input "$RUNNER_TEMP/tauri-release" \
            --version "$CANARY_VERSION"

      - name: Publish atomic draft-then-undraft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$(git ls-remote --tags origin "refs/tags/${CANARY_TAG}")" ]; then
            echo "::error::Tag ${CANARY_TAG} was claimed while the build was running."
            exit 1
          fi
          existing_releases=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq -- "$CANARY_TAG" <<< "$existing_releases"; then
            echo "::error::GitHub release ${CANARY_TAG} already exists."
            exit 1
          fi
          shopt -s nullglob
          files=( "$RUNNER_TEMP/ws-mcp-assets/"* "$RUNNER_TEMP/tauri-release/"* )
          if [ "${#files[@]}" -lt 20 ]; then
            echo "::error::Expected at least 20 release assets, found ${#files[@]}."
            exit 1
          fi
          published=0
          cleanup() {
            local status=$?
            if [ "$status" -ne 0 ] && [ "$published" -eq 0 ]; then
              if gh release view "$CANARY_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -Fxq 'true'; then
                echo "::warning::Cleaning up incomplete draft release ${CANARY_TAG}."
                gh release delete "$CANARY_TAG" --repo "$GITHUB_REPOSITORY" --yes || true
              fi
            fi
          }
          trap cleanup EXIT
          notes="Automated develop canary prerelease ${CANARY_TAG} from ${GITHUB_SHA}."
          gh release create "$CANARY_TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "$CANARY_TAG" \
            --notes "$notes"
          uploaded=$(gh release view "$CANARY_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.state == "uploaded") | .name')
          for file in "${files[@]}"; do
            if ! grep -Fxq -- "${file##*/}" <<< "$uploaded"; then
              echo "::error::Draft release ${CANARY_TAG} is missing uploaded asset ${file##*/}."
              exit 1
            fi
          done
          gh release edit "$CANARY_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease \
            --latest=false
          published=1
