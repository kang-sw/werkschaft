name: ws-mcp CI

# Runs the default Go test group on Linux and Windows, and the Werkschaft shell's
# Rust tests on macOS and Windows when the shell changed, for pull requests that touch
# the tooling or plugin trees, `workflow_call` from `ws-canary.yml`, and manual
# dispatch (`gh workflow run ws-mcp-ci.yml --ref develop`). A develop push starts no
# run; the ship flow dispatches this workflow on the exact commit it is about to tag,
# so a Windows-specific failure is caught before release. It is also the release's only
# test run: the tagged release workflow does not re-run the suite and instead refuses to
# publish unless this workflow succeeded on the tagged commit. It publishes nothing; the
# release workflow remains the sole path that builds and uploads release assets.
#
# Manual debug runs may pass `windows_shard` to run a single Windows shard
# alone; that skips Linux, desktop, long, and the remaining Windows shards so
# the release gate continues to refuse non-full runs.
on:
  pull_request:
    paths:
      - ".github/workflows/ws-mcp-ci.yml"
      - ".github/workflows/werkschaft-tauri-build.yml"
      - "agents-plugin-tool/**"
      - "agents-plugin/**"
      - "agents-plugin-wsflow/**"
  workflow_call:
    inputs:
      long_tests:
        description: "Also run the long test group"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      long_tests:
        description: "Also run the long test group"
        type: boolean
        default: false
      windows_shard:
        description: "Single Windows shard for manual debug (default 'all' runs full matrix)"
        type: choice
        default: "all"
        options:
          - "all"
          - "mcp-0"
          - "mcp-1"
          - "mcp-2"
          - "mcp-3"
          - "wsdashboard-0"
          - "wsdashboard-1"
          - "rest-0"
          - "rest-1"
          - "rest-2"

permissions:
  contents: read

jobs:
  test-matrix:
    name: select test matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.select.outputs.value }}
    steps:
      - name: Select matrix entries
        id: select
        env:
          EVENT: ${{ github.event_name }}
          WIN_SHARD: ${{ inputs.windows_shard }}
        run: |
          full_matrix='[
            {"os":"ubuntu-latest","shard":"mcp","args":"mcp"},
            {"os":"ubuntu-latest","shard":"wsdashboard-0","args":"wsdashboard 0 2"},
            {"os":"ubuntu-latest","shard":"wsdashboard-1","args":"wsdashboard 1 2"},
            {"os":"ubuntu-latest","shard":"rest-0","args":"rest 0 3"},
            {"os":"ubuntu-latest","shard":"rest-1","args":"rest 1 3"},
            {"os":"ubuntu-latest","shard":"rest-2","args":"rest 2 3"},
            {"os":"windows-latest","shard":"mcp-0","args":"mcp 0 4"},
            {"os":"windows-latest","shard":"mcp-1","args":"mcp 1 4"},
            {"os":"windows-latest","shard":"mcp-2","args":"mcp 2 4"},
            {"os":"windows-latest","shard":"mcp-3","args":"mcp 3 4"},
            {"os":"windows-latest","shard":"wsdashboard-0","args":"wsdashboard 0 2"},
            {"os":"windows-latest","shard":"wsdashboard-1","args":"wsdashboard 1 2"},
            {"os":"windows-latest","shard":"rest-0","args":"rest 0 3"},
            {"os":"windows-latest","shard":"rest-1","args":"rest 1 3"},
            {"os":"windows-latest","shard":"rest-2","args":"rest 2 3"}
          ]'
          if [ "$EVENT" != workflow_dispatch ] || [ -z "$WIN_SHARD" ] || [ "$WIN_SHARD" = all ]; then
            selected=$(printf '%s' "$full_matrix" | jq -c '{include: .}')
          else
            selected=$(printf '%s' "$full_matrix" | jq -c --arg shard "$WIN_SHARD" '{include: [.[] | select(.os == "windows-latest" and .shard == $shard)]}')
          fi
          if [ "$(printf '%s' "$selected" | jq '.include | length')" -eq 0 ]; then
            echo "unknown windows_shard: $WIN_SHARD" >&2
            exit 1
          fi
          echo "value=$selected" >> "$GITHUB_OUTPUT"

  test:
    name: go test (${{ matrix.os }}, ${{ matrix.shard }})
    needs: test-matrix
    # Runs on pull requests and manual dispatch only. Before tagging a release,
    # dispatch this workflow on the commit to tag (the ship flow's Publish CI
    # gate does this): the release's CI gate needs a green run on it.
    strategy:
      # Surface every leg's result; a Linux failure must not cancel the Windows
      # run, which is the one this workflow exists to catch early.
      fail-fast: false
      # Both Ubuntu and Windows shard the default group so no single leg
      # approaches the 25 min timeout:
      #   - internal/wsdashboard splits 2-way on both OSes (~15 min on Windows,
      #     ~10 min on Ubuntu).
      #   - internal/mcp runs as one leg on Ubuntu (~5.5 min) and splits 4-way
      #     on Windows (~15 min serially; git-process heavy).
      #   - remaining default packages (`rest`) split 3-way with heavy-package
      #     pins plus deterministic mod assignment so every future package
      #     automatically lands in exactly one `rest-*` shard.
      # On each OS, the union of its shards covers exactly `all`. Add the
      # opt-in long job for full coverage (agents-plugin-tool/scripts/ci-test-shard.sh).
      matrix: ${{ fromJson(needs.test-matrix.outputs.value) }}
    runs-on: ${{ matrix.os }}
    # The Windows smoke job in the release workflow once hung to ~46 min
    # (v0.37.2); a cap turns a hang here into a fast, legible failure.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agents-plugin-tool
        shell: bash
    steps:
      - name: Disable Defender real-time scanning (Windows)
        # Real-time scanning inspects every build-cache object and every git
        # process the tests spawn. Best effort: a runner image that refuses
        # the change still runs the tests, only slower.
        # Runs before checkout, so it cannot use the default working
        # directory, which does not exist yet.
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agents-plugin-tool/go.mod
          cache-dependency-path: agents-plugin-tool/go.sum

      - name: Generate and verify embedded workflow packages
        run: |
          python scripts/generate-package-assets.py
          python scripts/generate-package-assets.py --check
          python -m unittest discover -s scripts -p test_generate_package_assets.py -v

      - name: Run tests
        env:
          WS_TEST_EMBEDDED_PACKAGES: "1"
        run: bash scripts/ci-test-shard.sh ${{ matrix.args }}

  # Whether the Werkschaft shell changed. A pull request runs on every
  # agents-plugin-tool/** change, so the desktop job needs its own condition.
  # Outside pull requests (the ship flow's dispatch) it always answers true:
  # the release gate accepts no skipped job but the two long legs, so the
  # dispatch run on a tagged commit always runs and passes the desktop tests.
  desktop-changes:
    name: desktop change detection
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_shard || inputs.windows_shard == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.diff.outputs.desktop }}
    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect desktop changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            desktop=true
          elif git diff --name-only "$BASE" "$HEAD" |
            grep -qE '^(agents-plugin-tool/desktop/|\.github/workflows/(ws-mcp-ci|werkschaft-tauri-build)\.yml$)'; then
            desktop=true
          else
            desktop=false
          fi
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"

  desktop:
    name: cargo test (desktop, ${{ matrix.os }})
    needs: desktop-changes
    if: needs.desktop-changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The shell builds only for macOS and Windows (main.rs refuses others).
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: agents-plugin-tool/desktop
        shell: bash
    steps:
      - name: Disable Defender real-time scanning (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Check out repository
        uses: actions/checkout@v5

      # tauri::generate_context! reads tauri.conf.json, the ui/ pages, and
      # icons/ from the checkout; the test build bundles no daemon.
      - name: Set up pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Run the shell's Rust tests
        run: cargo test --locked --features custom-protocol

  # Explicit job names stay stable even when skipped before matrix expansion,
  # so the release gate can allow exactly these two skips.
  long-ubuntu:
    name: go test (ubuntu-latest, long)
    if: inputs.long_tests == true && (!inputs.windows_shard || inputs.windows_shard == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agents-plugin-tool
        shell: bash
    steps:
      - name: Disable Defender real-time scanning (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agents-plugin-tool/go.mod
          cache-dependency-path: agents-plugin-tool/go.sum

      - name: Generate embedded workflow packages
        run: python scripts/generate-package-assets.py

      - name: Run long tests
        run: bash scripts/ci-test-shard.sh long

  long-windows:
    name: go test (windows-latest, long)
    if: inputs.long_tests == true && (!inputs.windows_shard || inputs.windows_shard == 'all')
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agents-plugin-tool
        shell: bash
    steps:
      - name: Disable Defender real-time scanning (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agents-plugin-tool/go.mod
          cache-dependency-path: agents-plugin-tool/go.sum

      - name: Generate embedded workflow packages
        run: python scripts/generate-package-assets.py

      - name: Run long tests
        run: bash scripts/ci-test-shard.sh long
